[package]
name = "opengeul-com-worker"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/mod.rs"

[[test]]
name = "transport_windows"
path = "tests/transport_windows.rs"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx",
  "Win32_System_Com", "Win32_System_Console", "Win32_System_Environment",
  "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_Pipes",
  "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_System_Variant"
] }

[profile.dev]
debug = 0
incremental = false
