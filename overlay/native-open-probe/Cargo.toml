[package]
name = "opengeul-native-open-probe"
version = "1.0.0"
edition = "2021"
rust-version = "1.79"
publish = false
description = "제품 WinRT 활성화 경로의 별도 Windows 진단"

[dependencies]
opengeul-native-open = { path = "../native-open" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
