name: OpenGeul Firefox composition regression probe
on:
  push:
    branches: [work/firefox-input-diagnose]
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download previously source-verified parser binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37332857367 --repo ATLKR/OpenGeul --name opengeul-wasm-37332857367 --dir wasm-input
      - name: Build real frontend with final composition reconciliation
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/composition-final.test.mjs
          python scripts/prepare_upstream.py --fetch-only
          corepack enable
          (cd .work/hop && pnpm install --frozen-lockfile)
          python scripts/font_test_contract.py .work/hop
          python scripts/prepare_upstream.py --patch-only
          python scripts/prepare_hwpx.py .work/hop
          python scripts/patch_namespaces.py .work/hop/third_party/rhwp
          python scripts/wasm_artifacts.py install wasm-input .work/hop
          python scripts/patch_composition.py .work/hop
          (cd .work/hop && pnpm run test:studio && pnpm run build:studio)
          python scripts/buildkit.py frontend .work/hop/apps/studio-host/dist
          node e2e/generate-browser-fixtures.mjs .work/hop .work/e2e-fixtures
      - name: Install test browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install --with-deps "$BROWSER"
      - name: Exercise unchanged strict E2E assertions with the corrected application
        env:
          E2E_MODE: browser
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_FIXTURES: ${{ github.workspace }}/.work/e2e-fixtures
          E2E_OUTPUT: ${{ github.workspace }}/evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m http.server 7700 --bind 127.0.0.1 --directory .work/hop/apps/studio-host/dist > evidence/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python e2e/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: composition-${{ matrix.browser }}-${{ github.run_id }}
          path: evidence/
          retention-days: 1
