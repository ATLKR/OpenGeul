name: OpenGeul virtual printer probe
on:
  push:
    branches: [work/virtual-print-tests]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reuse only the exact PR4 payload for harness verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          gh run download 37404480348 --repo ATLKR/OpenGeul --name opengeul-windows-x64-37404480348 --dir package
          gh run download 37404480348 --repo ATLKR/OpenGeul --name opengeul-e2e-inputs-37404480348 --dir inputs
          Start-Service Spooler
          python -m pip install -r e2e/print-requirements.txt
          ./e2e/ensure-webview2.ps1
          python e2e/prepare_payload.py package runtime
      - name: Inspect native paper preferences without printing
        timeout-minutes: 3
        shell: pwsh
        run: python -u e2e/print_preferences_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: print-preferences-${{ matrix.os }}-${{ github.run_id }}
          path: preference-evidence/
          retention-days: 1
          if-no-files-found: warn
