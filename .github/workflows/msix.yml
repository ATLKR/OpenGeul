name: OpenGeul Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Preserve exact source bytes on Windows
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test and build full Windows editor, CLI and unsigned packages
        shell: pwsh
        run: ./scripts/build-msix.ps1
      - name: Upload verified build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-windows-x64-${{ github.run_id }}
          path: dist/*
          retention-days: 3
          if-no-files-found: error
  release:
    needs: build
    if: github.repository == 'ATLKR/OpenGeul' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Authorize immutable prerelease tag
        id: release
        run: python3 scripts/releasekit.py authorize
      - name: Download, reverify and publish unsigned development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$REPO" --name "opengeul-windows-x64-$BUILD_RUN_ID" --dir package
          (cd package && sha256sum --check SHA256SUMS.txt)
          python3 scripts/releasekit.py verify package/*.msix
          gh release create "$RELEASE_TAG" package/* --repo "$REPO" --target "$BUILD_SHA" --prerelease --latest=false \
            --title "OpenGeul $RELEASE_TAG — unsigned Windows development build" \
            --notes-file docs/RELEASE_NOTES.md
