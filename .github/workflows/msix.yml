name: 설치 없이 ARM Python 관찰
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-python-inventory-arm-113
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/python-inventory-arm-113')
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: 설치·캐시·컴파일 없이 현재 Python 확인
      shell: pwsh
      run: ./ci/diagnostics/python_inventory.ps1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: opengeul-python-inventory-arm-${{ github.run_id }}-${{ github.run_attempt }}
        path: python-inventory/*.json
        retention-days: 1
        if-no-files-found: error
        compression-level: 6
