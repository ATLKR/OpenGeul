name: ARM native Python cache와 stdlib 호환 진단
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-python:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/arm-native-python-cache-113')
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: 설치 없이 기존 native 3.12 toolcache 확인
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $nativeCache=Join-Path $env:RUNNER_TOOL_CACHE 'Python'
        $nativeMatches=@(Get-ChildItem $nativeCache -Directory | Where-Object { $_.Name -match '^3\.12\.[0-9]+$' -and (Test-Path (Join-Path $_.FullName 'arm64/python.exe')) -and (Test-Path (Join-Path $_.FullName 'arm64.complete')) })
        if ($nativeMatches.Count -lt 1 -or $nativeMatches.Count -gt 12) { throw 'Preinstalled native Python cache was not confirmed; installation is forbidden.' }
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: arm64
    - name: 실제 native stdlib helper와 소스·바이트 단위 시험
      shell: pwsh
      run: python -I -X utf8 ci/diagnostics/arm_native_python_probe.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: opengeul-arm-native-python-cache-${{ github.run_id }}-${{ github.run_attempt }}
        path: native-python-proof/*.json
        retention-days: 1
        if-no-files-found: error
        compression-level: 6
