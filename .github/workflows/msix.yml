name: OpenGeul Windows 빌드·개발판 게시
'on':
  push:
    branches: [main]
    tags: [v*]
    paths-ignore: [docs/**, website/**, '*.md']
  pull_request:
    paths-ignore: [docs/**, website/**, '*.md']
  workflow_dispatch:
    inputs:
      mode:
        description: full = 전체 검증과 허용된 릴리스 게시; engine/checks = 진단 전용, 게시하지 않음
        type: choice
        required: true
        default: full
        options: [full, engine, checks]
  schedule:
  - cron: 0 18 * * 0
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 고정된 CI 파서만 설치
      run: python -m pip install -r ci/requirements.txt
    - name: 공개·무료 workflow와 요청 단계 확인
      id: policy
      run: python ci/policy.py --event
    - name: CI·패키지 정책 회귀 검사
      run: |
        python -m unittest discover -s ci/tests -v
        python -m unittest discover -s tests -v
    if: github.event.repository.private == false
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 수정된 WASM 재빌드와 namespace 회귀 실패·수정 후 통과 확인
      run: bash scripts/build-wasm.sh
    - name: 업로드 전 전송 파일 크기 제한 검사
      shell: bash
      run: python ci/evidence.py size --limit-mib 32 .work/rebuilt-wasm
    - name: 소스가 일치하는 재빌드 엔진 전달
      if: needs.preflight.outputs.mode == 'full'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-wasm-${{ github.run_id }}
        path: |
          .work/rebuilt-wasm/rhwp.js
          .work/rebuilt-wasm/rhwp.d.ts
          .work/rebuilt-wasm/rhwp_bg.wasm
          .work/rebuilt-wasm/rhwp_bg.wasm.d.ts
          .work/rebuilt-wasm/package.json
          .work/rebuilt-wasm/LICENSE
          .work/rebuilt-wasm/OPEN_GEUL_WASM.json
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
    - name: 업로드 전 전송 파일 크기 제한 검사
      shell: bash
      run: python ci/evidence.py size --limit-mib 64 .work/e2e-fixtures .work/hop/apps/studio-host/dist
    - name: 제품 소스 브라우저 화면과 합성 시험 문서 전달
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-browser-inputs-${{ github.run_id }}
        path: |
          .work/e2e-fixtures
          .work/hop/apps/studio-host/dist
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
    needs: preflight
    if: github.event.repository.private == false && (needs.preflight.outputs.mode != 'checks')
  windows-editor:
    needs: [preflight, wasm]
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
    - name: Windows에서 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 이 실행에서 검증한 WASM 받기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-wasm-$env:GITHUB_RUN_ID" --dir wasm-input
    - name: 네이티브 표·PDF 정책 검사와 Windows 편집기 컴파일
      shell: pwsh
      run: ./scripts/build-msix.ps1 -Phase Editor -WasmDirectory wasm-input
    - name: 업로드 전 전송 파일 크기 제한 검사
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 64 .work/editor-component
    - name: 소스가 일치하는 편집기 구성요소 전달
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-editor-component-${{ github.run_id }}
        path: .work/editor-component/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
    - name: 네이티브 시험 문서만 준비
      shell: pwsh
      run: |
        python -c "import shutil; shutil.copytree('.work/e2e-fixtures', '.work/native-inputs/e2e-fixtures')"
        python ci/evidence.py size --limit-mib 16 .work/native-inputs
    - name: 네이티브 합성 시험 문서 전달
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-e2e-inputs-${{ github.run_id }}
        include-hidden-files: true
        path: .work/native-inputs/
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
    if: github.event.repository.private == false && (needs.preflight.outputs.mode == 'full')
  windows-cli:
    needs: [preflight, wasm]
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
    - name: Windows에서 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 이 실행에서 검증한 WASM 받기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-wasm-$env:GITHUB_RUN_ID" --dir wasm-input
    - name: 제품 Windows CLI 컴파일
      shell: pwsh
      run: ./scripts/build-msix.ps1 -Phase Cli -WasmDirectory wasm-input
    - name: 업로드 전 전송 파일 크기 제한 검사
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 32 .work/cli-component
    - name: 소스가 일치하는 CLI 구성요소 전달
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-cli-component-${{ github.run_id }}
        path: .work/cli-component/
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
    if: github.event.repository.private == false && (needs.preflight.outputs.mode == 'full')
  build:
    needs: [preflight, wasm, windows-editor, windows-cli]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
    - name: Windows에서 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 동일 실행의 두 구성요소 받기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-editor-component-$env:GITHUB_RUN_ID" --dir editor-input
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-cli-component-$env:GITHUB_RUN_ID" --dir cli-input
    - name: 서명 없는 패키지 생성 전 소스·바이트 일치 검증
      shell: pwsh
      run: ./scripts/build-msix.ps1 -Phase Package -EditorComponent editor-input -CliComponent cli-input
    - name: 업로드 전 전송 파일 크기 제한 검사
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 96 dist
    - name: 검증한 빌드 결과 업로드
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-windows-x64-${{ github.run_id }}
        path: dist/*
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
    if: github.event.repository.private == false && (needs.preflight.outputs.mode == 'full')
  native-e2e:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
      max-parallel: 2
    steps:
    - name: 암호 시험 문서 증거를 위한 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 동일 실행의 고정 빌드 입력 받기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-windows-x64-$env:GITHUB_RUN_ID" --dir package
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-e2e-inputs-$env:GITHUB_RUN_ID" --dir inputs
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-wasm-$env:GITHUB_RUN_ID" --dir wasm-input
    - name: 시험 도구 설치와 실제 제품 파일 신원 확인
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        python -m pip install -r e2e/requirements.txt
        ./e2e/ensure-webview2.ps1
        python e2e/prepare_payload.py package runtime
    - name: WebView2가 없을 때 사용자 안내
      shell: pwsh
      run: python e2e/check_webview2_missing.py --exe runtime/OpenGeul.exe --output evidence
    - name: 제품 WebView2와 실제 Windows 파일 대화상자 검사
      shell: pwsh
      run: |
        $env:E2E_MODE='native'
        $env:E2E_EXE=(Resolve-Path runtime/OpenGeul.exe).Path
        $env:E2E_FIXTURES=(Resolve-Path inputs/e2e-fixtures).Path
        $env:E2E_OUTPUT=Join-Path $pwd 'evidence'
        python e2e/run.py
    - name: 암호 재입력·평문 저장 동의·미저장 문서 닫기·교체 보호 검사
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        node e2e/password/generate-password-fixtures.mjs wasm-input inputs/e2e-fixtures password-fixtures
        python e2e/password/native.py --source-root . --fixtures password-fixtures --exe runtime/OpenGeul.exe --output evidence/password-native --expected-source $env:GITHUB_SHA --expected-run $env:GITHUB_RUN_ID
    - name: 검사 결과를 유지하며 증거 크기 제한
      if: always()
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      shell: pwsh
      run: python ci/evidence.py pack evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - name: 실패해도 크기가 제한된 UI 증거 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-e2e-${{ matrix.os }}-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
    if: github.event.repository.private == false
  browser-e2e:
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
      max-parallel: 3
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 제품 소스 브라우저 화면과 합성 시험 입력 받기
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "opengeul-browser-inputs-$GITHUB_RUN_ID" --dir inputs
    - name: 고정된 브라우저 자동화 도구 설치
      env:
        BROWSER: ${{ matrix.browser }}
      run: |
        python -m pip install -r e2e/requirements.txt
        python -m playwright install --with-deps "$BROWSER"
    - name: 실제 제품 화면과 다운로드·재열기 검사
      env:
        E2E_BROWSER: ${{ matrix.browser }}
        E2E_MODE: browser
        E2E_FIXTURES: ${{ github.workspace }}/inputs/e2e-fixtures
        E2E_OUTPUT: ${{ github.workspace }}/evidence
      run: |
        set -euo pipefail
        mkdir -p evidence
        python -m http.server 7700 --bind 127.0.0.1 --directory inputs/hop/apps/studio-host/dist > evidence/server.log 2>&1 &
        server=$!
        trap 'kill "$server" 2>/dev/null || true' EXIT
        python e2e/run.py
    - name: 검사 결과를 유지하며 증거 크기 제한
      if: always()
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      shell: bash
      run: python ci/evidence.py pack evidence bounded-evidence --status "$EVIDENCE_STATUS"
    - name: 실패해도 크기가 제한된 브라우저 증거 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: browser-e2e-${{ matrix.browser }}-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
    if: github.event.repository.private == false
  msix-install:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: 서명 없는 릴리스 후보 받기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-windows-x64-$env:GITHUB_RUN_ID" --dir package
    - name: 설치된 앱 실행을 위한 WebView2 준비
      shell: pwsh
      run: ./e2e/ensure-webview2.ps1
    - name: 시험 전용 서명·설치 앱 및 CLI 실행·WACK·파일 연결·제거 검사
      shell: pwsh
      run: ./e2e/msix-install.ps1 -PackageDirectory package -OutputDirectory evidence
    - name: 검사 결과를 유지하며 증거 크기 제한
      if: always()
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      shell: pwsh
      run: python ci/evidence.py pack evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - name: 인증서·서명 파일을 제외하고 설치 결과 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: msix-install-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
    if: github.event.repository.private == false
  virtual-print:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
      max-parallel: 2
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - name: 동일 실행의 실제 제품 파일과 합성 시험 입력 받기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-windows-x64-$env:GITHUB_RUN_ID" --dir package
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-e2e-inputs-$env:GITHUB_RUN_ID" --dir inputs
        gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "opengeul-wasm-$env:GITHUB_RUN_ID" --dir wasm-input
    - name: 독립 PDF 검사·기본 프린터·합성 문서 준비
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        Start-Service Spooler
        Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction Stop
        python -m pip install -r e2e/print-requirements.txt
        python -m unittest discover -s e2e/print_tests -v
        ./e2e/ensure-webview2.ps1
        python e2e/prepare_payload.py package runtime
        node e2e/table_height.mjs generate wasm-input print-fixtures
        python e2e/print_fixtures.py print-fixtures
        node e2e/verify_print_fixtures.mjs wasm-input print-fixtures
    - name: 실제 Windows 대화상자로 인쇄하고 스풀러·렌더링 PDF 검사
      shell: pwsh
      run: python -u e2e/virtual_print.py --exe runtime/OpenGeul.exe --inputs inputs/e2e-fixtures --fixtures print-fixtures --out print-evidence
    - name: 검사 결과를 유지하며 증거 크기 제한
      if: always()
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      shell: pwsh
      run: python ci/evidence.py pack print-evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - name: 실패해도 크기가 제한된 합성 인쇄 증거 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: virtual-print-${{ matrix.os }}-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
    if: github.event.repository.private == false
  release:
    needs: [wasm, build, native-e2e, browser-e2e, msix-install, virtual-print]
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: 고정 사전 릴리스 태그의 게시 조건 확인
      id: release
      run: python3 scripts/releasekit.py authorize
    - name: 검증 릴리스 받기·재검증·보존 또는 게시
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BUILD_RUN_ID: ${{ github.run_id }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
      run: |
        set -euo pipefail
        gh run download "$BUILD_RUN_ID" --repo "$REPO" --name "opengeul-windows-x64-$BUILD_RUN_ID" --dir package
        (cd package && sha256sum --check SHA256SUMS.txt)
        python3 scripts/releasekit.py verify package/*.msix
        python3 scripts/store_package.py --publish-release --release-tag "$RELEASE_TAG" --package-directory package
    - name: 명시적 안정판 태그 push의 Store 제출 실행
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
      run: python3 scripts/store_package.py --dispatch-store --release-tag "$RELEASE_TAG"
  cleanup-transports:
    needs: [preflight, wasm, browser-e2e, windows-editor, windows-cli, build, native-e2e, msix-install, virtual-print, release]
    if: github.event.repository.private == false && (always() && !cancelled() && github.repository == 'ATLKR/OpenGeul' && github.run_attempt == 1 && github.actor != 'dependabot[bot]' && needs.preflight.result == 'success' && needs.preflight.outputs.mode != 'checks' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 이 실행에서 성공적으로 사용한 임시 전송 파일만 정리
      env:
        GH_TOKEN: ${{ github.token }}
        CI_MODE: ${{ needs.preflight.outputs.mode }}
        CI_NEEDS: ${{ toJSON(needs) }}
      run: python ci/transport_cleanup.py
