name: ARM64 네이티브 인쇄 hit 읽기 진단
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-print-hit-readonly-113
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  native-hit:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/native-print-hit-113')
    runs-on: windows-11-arm
    timeout-minutes: 12
    env:
      E2E_ARCHITECTURE: arm64
    steps:
    - name: 기존 Windows 시험과 동일한 체크아웃 설정
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: x64
    - name: 기존 인쇄 컨트롤러 의존성·Microsoft PDF 드라이버 준비
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        Start-Service Spooler
        Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction Stop | Out-Null
        python -m pip install -r e2e/print-requirements.txt
        ./e2e/ensure-webview2.ps1
    - name: 공개 Source87 런타임에서 Preferences 입력 없이 hit 관계 읽기
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -u ci/native_print_hit_diagnostic.py
    - name: 진단 메타데이터만 크기 확인
      id: bounded-evidence
      if: always()
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 1 native-hit-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.bounded-evidence.outcome == 'success'
      with:
        name: native-print-hit-readonly-${{ github.run_id }}-${{ github.run_attempt }}
        path: native-hit-evidence/
        if-no-files-found: warn
        retention-days: 1
        compression-level: 9
