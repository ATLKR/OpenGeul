name: OpenGeul native password qualification
'on':
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full]
        default: full
        required: true
        description: Qualify the fixed source build with synthetic password documents
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  native-password:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/native-password-38142625600')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
    - name: Preserve exact source bytes for WASM overlay provenance
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Download only the fixed successful source candidate and its same-run inputs
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: python e2e/download-password-candidate.py
    - name: Verify complete MSIX portable parity and prepare native UI tools
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        python -m pip install -r e2e/requirements.txt
        ./e2e/ensure-webview2.ps1
        python e2e/prepare_payload.py package runtime
    - name: Generate only own synthetic password documents with the source-bound engine
      shell: pwsh
      run: node probe/generate-password-fixtures.mjs wasm-input inputs/e2e-fixtures password-fixtures
    - name: Exercise actual Windows password open and save controls
      shell: pwsh
      run: python probe/password-native.py --source-root . --fixtures password-fixtures --exe runtime/OpenGeul.exe --output evidence/password-native
    - name: Preserve bounded results without uploading documents, fonts or keys
      if: always()
      shell: pwsh
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      run: python ci/evidence.py pack evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-password-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
