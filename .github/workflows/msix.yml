name: OpenGeul ARM64 cold compiler 병렬도 8·12·16 진단
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opengeul-cold-pressure-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  compile-pressure:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' && github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/cargo-pressure-arm64-8-12-16')
    name: Cold ${{ matrix.workload }} · jobs ${{ matrix.jobs }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        jobs: [8, 12, 16]
        workload: [cli, editor-release]
    steps:
    - name: Windows에서 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 고정 CI 파서만 설치·공개 무료 정책 검사
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        python -m pip install -r ci/requirements.txt
        python ci/policy.py
        python -m unittest discover -s ci/tests -p test_pressure_benchmark.py -v
    - name: 실제 Source75 원본 WASM의 head·a1·ZIP SHA·size·CRC 검사
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: python ci/pressure_benchmark.py download-wasm
    - name: 동일 고정 upstream·제품 소스·프런트엔드 준비 (컴파일 측정 제외)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        python scripts/prepare_upstream.py --fetch-only
        $lock = Get-Content config/upstream.lock.json -Raw | ConvertFrom-Json
        $target = 'aarch64-pc-windows-msvc'
        rustup toolchain install "$($lock.rust)-$target" --profile minimal --target $target
        corepack enable
        Push-Location .work/hop
        try {
          pnpm install --frozen-lockfile
          pnpm run test:upstream
          pnpm run test:studio
        } finally { Pop-Location }
        python scripts/prepare_hwpx.py .work/hop --red-probe
        python scripts/font_test_contract.py .work/hop
        python scripts/prepare_upstream.py --patch-only
        python scripts/prepare_hwpx.py .work/hop
        python scripts/patch_composition.py .work/hop
        node --experimental-strip-types --loader ./tests/hop/loader.mjs --test tests/hop/*.test.mjs
        python scripts/patch_namespaces.py .work/hop/third_party/rhwp
        python scripts/wasm_artifacts.py install wasm-input .work/hop
        node e2e/table_height.mjs generate .work/hop/apps/studio-host/vendor/rhwp-core .work/table-fixtures
        python e2e/table_height_fixtures.py .work/table-fixtures
        node e2e/table_height.mjs verify .work/hop/apps/studio-host/vendor/rhwp-core .work/table-fixtures
        python scripts/prepare_native_tests.py .work/hop/third_party/rhwp
        Push-Location .work/hop
        try {
          pnpm run test:studio
          pnpm run build:studio
          python ../../scripts/buildkit.py frontend apps/studio-host/dist
        } finally { Pop-Location }
    - name: 같은 제품 원본 명령 cold 컴파일·2초 Win32 CPU/RAM 관측
      id: compile
      shell: pwsh
      run: python ci/pressure_benchmark.py measure --jobs ${{ matrix.jobs }} --workload ${{ matrix.workload }}
    - name: 실패 원본도 16 MiB 제한 검사
      if: always() && !cancelled()
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 16 pressure-evidence
    - name: 진단 원본·소스 계약·자원 샘플·로그만 1일 보존
      if: always() && !cancelled()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-cold-pressure-${{ matrix.workload }}-${{ matrix.jobs }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: pressure-evidence/
        retention-days: 1
        if-no-files-found: error
        compression-level: 6
