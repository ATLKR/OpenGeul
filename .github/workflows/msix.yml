name: OpenGeul 동일 서명 ARM64 SDK 진단
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: same-signed-arm-sdk-source81-${{ github.ref }}
  cancel-in-progress: false
jobs:
  msix-install-arm64:
    name: 동일 서명 ARM64 stock SDK 진단
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/same-signed-arm-sdk-source81')
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: 원 Source81 후보 API·원 ZIP·서명·전체 런타임 출처 검증
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python e2e/same-signed-arm-sdk-diagnostic.py prepare --directory diagnostic
      - name: 수정한 원 importer AST와 정식 SDK의 동일 서명 전체 WACK 진단
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          ./e2e/same-signed-arm-sdk-diagnostic.ps1 -PackageDirectory diagnostic/package -NativeDirectory diagnostic/native-input -OutputDirectory diagnostic/evidence
          python e2e/same-signed-arm-sdk-diagnostic.py verify --directory diagnostic
      - name: 원본 증거를 생략 없이 제한하고 실패 상태 유지
        if: always()
        shell: pwsh
        env:
          EVIDENCE_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python ci/evidence.py pack diagnostic/evidence bounded-evidence --status $env:EVIDENCE_STATUS
      - name: SDK 진단 원문 보존 — 개인 키·서명 패키지는 업로드하지 않음
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: same-signed-arm-sdk-source81-${{ github.run_id }}
          path: bounded-evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
