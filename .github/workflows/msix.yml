name: OpenGeul Windows build and release
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msix-cli-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  msix-install:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' && github.repository == 'ATLKR/OpenGeul')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.ref }}
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Download the unchanged failed-run candidate for diagnostics
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        gh run download 38124729934 --repo ATLKR/OpenGeul --name opengeul-windows-x64-38124729934 --dir package
    - name: Verify all candidate checksums, provenance and unsigned MSIX
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        python -c "import sys; from pathlib import Path; sys.path.insert(0, 'e2e'); from prepare_payload import verify_checksums; verify_checksums(Path('package'))"
        $provenance=Get-Content package/provenance.json -Raw | ConvertFrom-Json
        if ($provenance.repository -ne 'ATLKR/OpenGeul' -or [string]$provenance.runId -ne '38124729934' -or $provenance.commit -ne '89f6379919a3c192daf4abe37b93446dac5713d0') { throw 'Candidate provenance does not match the fixed diagnostic source run.' }
        $candidate=@(Get-ChildItem package -Filter '*.msix')
        if ($candidate.Count -ne 1) { throw 'Exactly one candidate MSIX required.' }
        python scripts/releasekit.py verify $candidate[0].FullName
    - name: Prepare WebView2 for installed app launch
      shell: pwsh
      run: ./e2e/ensure-webview2.ps1
    - name: Diagnose installed CLI startup with the unchanged candidate
      shell: pwsh
      run: ./e2e/msix-install.ps1 -PackageDirectory package -OutputDirectory evidence
    - name: Bound diagnostic evidence without changing test status
      if: always()
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      shell: pwsh
      run: python ci/evidence.py pack evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - name: Preserve diagnostic evidence without certificates or signed artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: msix-cli-diagnostic-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
