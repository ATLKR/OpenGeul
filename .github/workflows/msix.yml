name: OpenGeul Windows CI
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Read the confirmed WACK DPI carrier without changing any app package
        type: choice
        options: [full]
        default: full
        required: true
permissions:
  contents: read
jobs:
  sdk-il-diagnostic:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/msix-manifest-38132094391')
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Read only the confirmed SDK DPI carrier and test mapping
      shell: pwsh
      run: |
        ./e2e/wack-sdk-il-observation.ps1 -SelfTest
        ./e2e/wack-sdk-il-observation.ps1 -OutputDirectory evidence
    - name: Preserve bounded static evidence without publishing a package
      if: always()
      shell: pwsh
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      run: python ci/evidence.py pack evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: sdk-il-diagnostic-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
