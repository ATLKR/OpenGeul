name: OpenGeul single CSV post-getter diagnostic
'on':
  push:
    branches: [work/opengeul-office-csv-postgetter-control]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  csv-control-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
    - name: Preserve exact source bytes
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: x64
    - name: Prepare pinned native UI tools
      shell: pwsh
      run: |
        python -m pip install pywinauto==0.6.9 Pillow==12.3.0
        if ($LASTEXITCODE -ne 0) { throw 'Native UI prerequisites failed.' }
    - name: Verify focused diagnostic and unchanged Home contracts
      shell: pwsh
      run: |
        python -m unittest suite.tests.test_csv_postgetter_control suite.tests.test_home_routing_smoke suite.tests.test_home_calc_close suite.tests.test_native_cleanup_receipt -v
        if ($LASTEXITCODE -ne 0) { throw 'CSV diagnostic boundary tests failed.' }
    - name: Build the current pinned x64 Suite package and retain the build log
      id: build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force .work | Out-Null
        Start-Transcript -Path .work/csv-control-build.log
        try {
          $lock = Get-Content suite/config/runtime.lock.json -Raw | ConvertFrom-Json
          if ($lock.architecture -cne 'x64' -or $lock.version -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+-dev\z') { throw 'Unexpected Suite identity.' }
          "SUITE_PACKAGE=dist/OpenGeul-Office-$($lock.version)-windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./suite/scripts/build-suite.ps1 -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw 'Suite package build failed.' }
        } finally { Stop-Transcript }
    - name: Prepare the genuine canonical twenty-one fixture baseline
      id: office-features
      if: '!cancelled() && steps.build.outcome == ''success'''
      shell: pwsh
      run: |
        $package = (Resolve-Path $env:SUITE_PACKAGE).Path
        & "$package/Office/program/python.exe" suite/e2e/office_feature_smoke.py --suite $package --output .work/suite-office-features
        if ($LASTEXITCODE -ne 0) { throw 'Fresh canonical Office feature fixtures failed.' }
    - name: Observe exactly one physical CSV Home Open and retain its original post-getter PNG
      id: csv-control
      if: '!cancelled() && steps.office-features.outcome == ''success'''
      shell: pwsh
      run: |
        $package = (Resolve-Path $env:SUITE_PACKAGE).Path
        python suite/e2e/csv_postgetter_control.py --suite $package --features .work/suite-office-features --output .work/suite-csv-postgetter-control
        if ($LASTEXITCODE -ne 0) { throw 'Single CSV diagnostic failed; retained evidence requires review.' }
    - name: Verify complete package after success or failure
      id: post-verify
      if: 'always() && steps.build.outcome == ''success'''
      shell: pwsh
      run: |
        $package = (Resolve-Path $env:SUITE_PACKAGE).Path
        python suite/scripts/verify-suite.py $package
        if ($LASTEXITCODE -ne 0) { throw 'CSV diagnostic package integrity failed.' }
    - name: Preserve original source joins, fixtures, getter, PNG and native archive evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-csv-postgetter-control-x64-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .work/suite-office-features/
          .work/suite-csv-postgetter-control/
          .work/csv-control-build.log
          .work/office-suite/msi.msi.log
          dist/**/suite-inventory.json
          dist/**/suite-provenance.json
          dist/**/runtime-branding.json
          dist/**/suite-product.json
          dist/**/Sources/
          dist/**/worker/
          dist/**/OpenGeul.Office.*
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: error
