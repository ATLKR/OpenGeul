name: OpenGeul actual Korean servicing source diagnosis
'on':
  push:
    branches:
    - work/suite-ime-servicing
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  windows-suite:
    if: github.repository == 'ATLKR/OpenGeul' && github.event.repository.private ==
      false
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Validate exact diagnostic source
      id: units
      shell: pwsh
      run: 'python -m unittest discover -s suite/tests -v

        if ($LASTEXITCODE -ne 0) { throw ''Diagnostic source tests failed.'' }

        '
    - name: Install actual Korean IME from matching official offline media
      id: readiness
      if: '!cancelled() && steps.units.outcome == ''success'''
      shell: pwsh
      run: ./suite/scripts/ensure-korean-ime.ps1 -Output .work/suite-korean-readiness
    - name: Preserve actual readiness and original servicing logs immediately
      if: '!cancelled() && steps.units.outcome == ''success'''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-focused-readiness-${{ github.run_id }}
        path: '.work/suite-korean-readiness/

          !.work/suite-korean-readiness/fod-source/**/*.cab

          '
        retention-days: 1
        if-no-files-found: error
