name: OpenGeul Office unpublished draft delivery

on:
  push:
    branches:
      - work/suite-artifact-delivery
    paths:
      - .github/workflows/office-suite-delivery.yml

permissions:
  contents: write
  actions: read

jobs:
  deliver:
    if: github.repository == 'ATLKR/OpenGeul' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify exact successful artifacts and create unpublished draft only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPOSITORY = 'ATLKR/OpenGeul'
          SOURCE_RUN = 38909448104
          SOURCE_HEAD = '579511489f9def03dd8d894ef249fd8ed9c8fa10'
          TAG = 'opengeul-office-0.1.0-dev'
          OUT = Path('draft-delivery')
          OUT.mkdir(exist_ok=False)
          TOKEN = os.environ['GITHUB_TOKEN']
          API = 'https://api.github.com/repos/' + REPOSITORY

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def request_json(path, payload=None):
              if not path.startswith('/') or path.startswith('//'):
                  raise RuntimeError('Invalid API path')
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(API + path, data=data, headers={
                  'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'OpenGeul-draft-delivery',
                  'Content-Type': 'application/json',
              })
              try:
                  with opener.open(request, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  code = error.code
                  error.close()
                  raise RuntimeError('GitHub API request failed: HTTP ' + str(code)) from None

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as source:
                  while block := source.read(1024 * 1024):
                      digest.update(block)
              return digest.hexdigest()

          def download_artifact(artifact_id, expected_size, expected_hash, name):
              metadata = request_json('/actions/artifacts/' + str(artifact_id))
              require(metadata['id'] == artifact_id and not metadata['expired'], 'Artifact is missing or expired')
              require(metadata['size_in_bytes'] == expected_size, 'Artifact size metadata differs')
              require(metadata['workflow_run']['id'] == SOURCE_RUN, 'Artifact source run differs')
              require(metadata['workflow_run']['head_sha'] == SOURCE_HEAD, 'Artifact source commit differs')
              require(metadata.get('digest') in (None, 'sha256:' + expected_hash), 'Artifact digest metadata differs')
              request = urllib.request.Request(API + '/actions/artifacts/' + str(artifact_id) + '/zip', headers={
                  'Authorization': 'Bearer ' + TOKEN,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'OpenGeul-draft-delivery',
              })
              try:
                  response = opener.open(request, timeout=120)
              except urllib.error.HTTPError as error:
                  require(error.code == 302, 'Artifact API did not return the expected redirect')
                  location = error.headers.get('Location', '')
                  error.close()
              else:
                  response.close()
                  raise RuntimeError('Artifact API did not return the expected redirect')
              parsed = urllib.parse.urlsplit(location)
              require(parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password,
                      'Artifact storage location is invalid')
              require(parsed.hostname.endswith(('.blob.core.windows.net', '.githubusercontent.com')),
                      'Artifact storage host is unexpected')
              target = OUT / name
              digest = hashlib.sha256()
              count = 0
              # This separate anonymous request never receives the GitHub credential.
              try:
                  anonymous_request = urllib.request.Request(location, headers={'User-Agent': 'OpenGeul-draft-delivery'})
                  with urllib.request.urlopen(anonymous_request, timeout=120) as response, target.open('xb') as output:
                      while block := response.read(1024 * 1024):
                          count += len(block)
                          require(count <= expected_size, 'Artifact exceeds the pinned size')
                          digest.update(block)
                          output.write(block)
              except urllib.error.HTTPError as error:
                  code = error.code
                  error.close()
                  raise RuntimeError('Anonymous artifact download failed: HTTP ' + str(code)) from None
              except Exception as error:
                  # Signed storage URLs must never appear in exception logs.
                  raise RuntimeError('Anonymous artifact download failed: ' + type(error).__name__) from None
              require(count == expected_size and digest.hexdigest() == expected_hash, 'Artifact bytes do not match the pin')
              return target

          def extract_member(archive, member, output_name, size=None, expected_hash=None):
              with zipfile.ZipFile(archive) as source:
                  matches = [entry for entry in source.infolist() if entry.filename == member]
                  require(len(matches) == 1 and not matches[0].is_dir(), 'Expected archive member is not unique')
                  if size is not None:
                      require(matches[0].file_size == size, 'Archive member size differs')
                  target = OUT / output_name
                  with source.open(matches[0]) as entry, target.open('xb') as output:
                      while block := entry.read(1024 * 1024):
                          output.write(block)
                  # Reading the entire member also validates its ZIP CRC.
              if expected_hash is not None:
                  require(sha256(target) == expected_hash, 'Archive member SHA-256 differs')
              return target

          run = request_json('/actions/runs/' + str(SOURCE_RUN))
          require(run['id'] == SOURCE_RUN and run['status'] == 'completed' and run['conclusion'] == 'success',
                  'The source run is not successful')
          require(run['head_sha'] == SOURCE_HEAD and run['repository']['full_name'] == REPOSITORY,
                  'The source run identity differs')
          package_artifact = download_artifact(12049897911, 592780912,
              'e3d1d7bc9cae3ff18038d9d93be05b9c7af44541999169e93761b8d0c725de0d', 'source-artifact.zip')
          package = extract_member(package_artifact, 'OpenGeul-Office-0.1.0-dev-windows-x64.zip',
              'OpenGeul-Office-0.1.0-dev-windows-x64.zip', 592780716,
              '87571bfa914950876837bc79e431168056a65fa357fadcafb0030463b9b25995')
          evidence = download_artifact(12049558509, 2546436,
              '8876ce85241bb512f1d68e4c03332a269aa52398cb9ed1fcb1d737435bed7080',
              'OpenGeul-Office-validation-evidence.zip')
          with zipfile.ZipFile(evidence) as archive:
              engine = json.loads(archive.read('suite-engine/engine-smoke.json'))
              native = json.loads(archive.read('suite-native/results.json'))
              reopened = json.loads(archive.read('suite-engine/ui-engine-verification.json'))
              require(engine['passed'] is True and len(engine['cases']) == 6, 'Engine evidence differs')
              require(native['success'] is True and native['passedCaseCount'] == 13, 'GUI evidence differs')
              require(reopened['passed'] is True and len(reopened['cases']) == 6, 'Post-GUI evidence differs')
              expected_modules = {'writer', 'calc', 'impress', 'draw', 'math', 'base'}
              require(set(native['nativeAttachmentModules']) == expected_modules, 'Attachment evidence differs')
              require(set(native['newDocumentModules']) == expected_modules, 'New-document evidence differs')
              require(set(native['physicalInputModules']) == {'writer', 'calc', 'impress'}, 'Physical-input evidence differs')
          home = extract_member(evidence, 'suite-native/home.png', 'OpenGeul-Office-home.png', 28164,
              'b41b28fda2606e800151d9e6a01b0b277c3a42f145c1344eebe3ef4850eda1fc')
          writer = extract_member(evidence, 'suite-native/writer-edited.png', 'OpenGeul-Office-Writer.png', 43286,
              'be4bfd61f4f67b7dcafbdf23de179e30030df3dd16c861d3c3a13e22e6ef8d61')

          # The exact reviewed guide and report are embedded by the preparation script.
          EMBEDDED_ASSETS = {'OpenGeul-Office-사용안내.txt': '', 'OpenGeul-Office-검증결과.md': ''}
          embedded = []
          for name, encoded in EMBEDDED_ASSETS.items():
              target = OUT / name
              target.write_bytes(base64.b64decode(encoded, validate=True))
              embedded.append(target)
          assets = [package, *embedded, home, writer, evidence]
          asset_manifest = [{'name': asset.name, 'bytes': asset.stat().st_size, 'sha256': sha256(asset)} for asset in assets]
          attestation = OUT / 'OpenGeul-Office-delivery-attestation.json'
          attestation.write_text(json.dumps({
              'repository': REPOSITORY, 'sourceRun': SOURCE_RUN, 'sourceCommit': SOURCE_HEAD,
              'sourceArtifact': {'id': 12049897911, 'bytes': 592780912,
                  'sha256': 'e3d1d7bc9cae3ff18038d9d93be05b9c7af44541999169e93761b8d0c725de0d'},
              'evidenceArtifact': {'id': 12049558509, 'bytes': 2546436,
                  'sha256': '8876ce85241bb512f1d68e4c03332a269aa52398cb9ed1fcb1d737435bed7080'},
              'checks': {'engineModules': 6, 'guiCases': 13, 'postGuiModules': 6,
                  'physicalInputModules': ['writer', 'calc', 'impress']},
              'delivery': 'Unpublished draft only; original validated package, no rebuild',
              'assets': asset_manifest,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assets.append(attestation)

          body = '''Windows x64 portable 개발판 — **미공개 초안**입니다. 공개 릴리스나 Store 배포를 수행하지 않습니다.

          검증된 원본 패키지를 재빌드 없이 전달합니다. ZIP 전체를 새 폴더에 풀고 `OpenGeul.Office.exe`를 실행하세요. 사용 안내, 검증 결과, 실제 화면 및 원본 검증 자료를 첨부했습니다.

          - 전체 성공 실행: https://github.com/ATLKR/OpenGeul/actions/runs/38909448104
          - 정확한 테스트 소스: https://github.com/ATLKR/OpenGeul/commit/579511489f9def03dd8d894ef249fd8ed9c8fa10
          - 작업 브랜치: https://github.com/ATLKR/OpenGeul/tree/work/opengeul-office-suite
          - Python 검사: 175개 통과, 선택적 환경 검사 1개 제외. C# 검사: 41개 통과.
          - 실제 엔진 6개, GUI 13개, GUI 이후 내용 재검증 6개 통과.
          - GUI 키보드 입력·저장은 Writer·Calc·Impress에서 검증했습니다. Draw·Math·Base의 GUI 편집 전체를 검증한 것은 아닙니다. HWP는 이 GUI 13개 검사에 포함되지 않습니다.
          - 새 Base는 GUI 다른 이름으로 저장과 종료 후 파일 존속을 확인했습니다.

          패키지: `OpenGeul-Office-0.1.0-dev-windows-x64.zip` (592,780,716바이트)
          SHA-256: `87571bfa914950876837bc79e431168056a65fa357fadcafb0030463b9b25995`
          원본 Actions 아카이브: 592,780,912바이트, SHA-256 `e3d1d7bc9cae3ff18038d9d93be05b9c7af44541999169e93761b8d0c725de0d`.

          이전 Windows 검증에서 Calc 초기화가 한 차례 실패했습니다. 최신 전체 실행은 통과했지만 원인이 확정되거나 수정된 것으로 표시하지 않습니다. 한국어 IME 전체 조합, ARM64, 실제 프린터, 강제 종료 후 복구, Store 배포는 검증하지 않았습니다. 중요한 원본을 보관하고 저장 결과를 확인하세요. 일부 엔진 메뉴는 영어이며 원본 저작권·라이선스와 바이너리 제작사 메타데이터는 보존합니다.
          '''

          matches = []
          for page in range(1, 101):
              releases = request_json('/releases?per_page=100&page=' + str(page))
              matches.extend(item for item in releases if item['tag_name'] == TAG)
              if len(releases) < 100:
                  break
          else:
              raise RuntimeError('Release pagination limit exceeded')
          require(len(matches) <= 1, 'Multiple releases use the delivery tag')

          def check_draft(release):
              require(release['draft'] is True and release['published_at'] is None,
                      'Refusing to modify a published release')
              require(release['tag_name'] == TAG and release['target_commitish'] == SOURCE_HEAD,
                      'Existing draft targets a different commit')
              require(release['prerelease'] is True, 'Existing draft is not the expected prerelease')

          if matches:
              release = matches[0]
              check_draft(release)
          else:
              # No git-ref API call and no publish/update call: creating an unpublished draft only.
              release = request_json('/releases', {
                  'tag_name': TAG, 'target_commitish': SOURCE_HEAD,
                  'name': 'OpenGeul Office 0.1.0-dev', 'body': body,
                  'draft': True, 'prerelease': True,
              })
              check_draft(release)

          release_id = release['id']
          existing = []
          for page in range(1, 101):
              batch = request_json('/releases/' + str(release_id) + '/assets?per_page=100&page=' + str(page))
              existing.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError('Asset pagination limit exceeded')

          upload_base = release['upload_url'].split('{', 1)[0]
          parsed = urllib.parse.urlsplit(upload_base)
          require(parsed.scheme == 'https' and parsed.netloc == 'uploads.github.com' and not parsed.query
                  and not parsed.fragment and parsed.path == '/repos/' + REPOSITORY + '/releases/' + str(release_id) + '/assets',
                  'Unexpected release upload destination')
          for asset in assets:
              check_draft(request_json('/releases/' + str(release_id)))
              expected_size, expected_hash = asset.stat().st_size, sha256(asset)
              same_name = [item for item in existing if item['name'] == asset.name]
              require(len(same_name) <= 1, 'Duplicate release asset name')
              if same_name:
                  require(same_name[0]['state'] == 'uploaded' and same_name[0]['size'] == expected_size
                          and same_name[0].get('digest') == 'sha256:' + expected_hash,
                          'Existing asset differs or cannot be verified; refusing overwrite')
                  print('Reused verified draft asset: ' + asset.name)
                  continue
              content_type = 'application/zip' if asset.suffix == '.zip' else (
                  'image/png' if asset.suffix == '.png' else 'application/json' if asset.suffix == '.json' else 'text/plain; charset=utf-8')
              with asset.open('rb') as data:
                  upload = urllib.request.Request(upload_base + '?' + urllib.parse.urlencode({'name': asset.name}),
                      data=data, method='POST', headers={
                          'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json',
                          'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'OpenGeul-draft-delivery',
                          'Content-Type': content_type, 'Content-Length': str(expected_size),
                      })
                  try:
                      # NoRedirect ensures credentials cannot follow any upload redirect.
                      with opener.open(upload, timeout=600) as response:
                          uploaded = json.load(response)
                  except urllib.error.HTTPError as error:
                      code = error.code
                      error.close()
                      raise RuntimeError('GitHub asset upload failed: HTTP ' + str(code)) from None
              require(uploaded['name'] == asset.name and uploaded['state'] == 'uploaded'
                      and uploaded['size'] == expected_size and uploaded.get('digest') == 'sha256:' + expected_hash,
                      'Uploaded asset metadata does not match its bytes')
              print('Uploaded verified draft asset: ' + asset.name)
          check_draft(request_json('/releases/' + str(release_id)))
          print('Unpublished draft delivery: ' + release['html_url'])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('Unpublished draft: ' + release['html_url'] + '\n\n')
              summary.write('Tested source: `' + SOURCE_HEAD + '`\n\n')
              for asset in assets:
                  summary.write('- ' + asset.name + ': ' + str(asset.stat().st_size) + ' bytes; SHA-256 `' + sha256(asset) + '`\n')
