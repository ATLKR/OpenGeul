          def check_draft(release, head):
              require(release.get('draft') is True and release.get('published_at') is None
                      and release.get('prerelease') is True and release.get('tag_name') == TAG
                      and release.get('target_commitish') == head, 'Refusing an unrelated or published release')
          
          
          def preflight_draft_assets(existing, assets):
              """Validate every present asset before any missing asset may be uploaded."""
              local = {path.name: path for path in assets}
              require(local and len(local) == len(assets) and isinstance(existing, list),
                      'Draft asset preflight needs unique local assets and a complete server list')
              present = {}
              for row in existing:
                  require(isinstance(row, dict) and isinstance(row.get('name'), str)
                          and row['name'] in local and row['name'] not in present,
                          'Existing draft contains unexpected or duplicated assets')
                  path = local[row['name']]
                  require(row.get('state') == 'uploaded' and type(row.get('size')) is int
                          and row['size'] == path.stat().st_size
                          and row.get('digest') == 'sha256:' + sha256(path),
                          'Existing draft asset state/digest/size differs from verified local bytes')
                  present[row['name']] = row
              return present
          
          
          def main(argv=None):
