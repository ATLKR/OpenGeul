                  + '`. Exact successful run: https://github.com/' + REPOSITORY + '/actions/runs/' + str(args.source_run)
                  + '.\n\nAll finite 0.1.1 development acceptance gates passed; see the original evidence ZIP '
                    'and delivery attestation for counts, scope and SHA256 values. This remains an unpublished '
                    'development draft. Store publication, ARM64 and complete document compatibility are separate.')
              write_json(args.output / 'draft-plan.json', {'tag': TAG, 'targetCommit': args.source_head,
                  'draft': True, 'prerelease': True, 'assetNames': [path.name for path in assets], 'body': body,
                  'verifiedSuiteInventory': retained_inventory, 'receiptMetadataContractVersion': 2})
              if not args.create_draft:
                  print('Verified delivery plan prepared locally; no GitHub mutation performed.')
                  return 0
              # All byte, unit, GUI and source gates finished before mutation is enabled.
              gh.mutate = True
              matches = [release for release in gh.pages('/releases') if release.get('tag_name') == TAG]
              require(len(matches) <= 1, 'The development tag has ambiguous releases')
              refs = gh.json('/git/matching-refs/tags/' + TAG)
              require(not any(row.get('ref') == 'refs/tags/' + TAG for row in refs),
                      'The delivery tag already exists; refusing an ambiguous existing tag target')
              if matches:
                  release = matches[0]
                  check_draft(release, args.source_head)
                  require(release.get('name') == 'OpenGeul Office ' + VERSION and release.get('body') == body,
                          'Existing draft text differs; refusing any update')
              else:
                  release = gh.json('/releases', {'tag_name': TAG, 'target_commitish': args.source_head,
                      'name': 'OpenGeul Office ' + VERSION, 'body': body, 'draft': True, 'prerelease': True})
              check_draft(release, args.source_head)
              existing = gh.pages('/releases/' + str(release['id']) + '/assets')
              present = preflight_draft_assets(existing, assets)
              server_assets = []
              for asset in assets:
                  check_draft(gh.json('/releases/' + str(release['id'])), args.source_head)
                  same = present.get(asset.name)
                  uploaded = same if same is not None else gh.upload(release, asset)
                  require(uploaded.get('name') == asset.name and uploaded.get('state') == 'uploaded'
                          and uploaded.get('size') == asset.stat().st_size and uploaded.get('digest') == 'sha256:' + sha256(asset),
                          'Server asset digest/size differs from verified local bytes')
                  server_assets.append({'id': uploaded['id'], 'name': uploaded['name'], 'size': uploaded['size'], 'digest': uploaded['digest']})
              check_draft(gh.json('/releases/' + str(release['id'])), args.source_head)
              uploaded = gh.pages('/releases/' + str(release['id']) + '/assets')
              require({row['name'] for row in uploaded} == {path.name for path in assets} and len(uploaded) == len(assets),
                      'Final draft asset set differs')
              local = {path.name: path for path in assets}
              require(all(row.get('state') == 'uploaded' and row.get('size') == local[row['name']].stat().st_size
                          and row.get('digest') == 'sha256:' + sha256(local[row['name']]) for row in uploaded),
                      'Final server asset hashes differ from verified local bytes')
              write_json(args.output / 'server-delivery-receipt.json', {'releaseId': release['id'], 'url': release['html_url'],
                  'draft': True, 'published': False, 'assets': server_assets})
              print('Verified unpublished draft: ' + release['html_url'])
              return 0
          
          
          if __name__ == '__main__':
              arguments = ['--source-run', os.environ['SOURCE_RUN'], '--source-head', os.environ['SOURCE_HEAD'],
                  '--run-attempt', os.environ['SOURCE_ATTEMPT'], '--python-tests', os.environ['PYTHON_TESTS'],
                  '--python-skips', os.environ['PYTHON_SKIPS'], '--core-tests', os.environ['CORE_TESTS'],
                  '--output', 'draft-delivery']
              require(os.environ['CREATE_DRAFT'] in ('true', 'false'), 'Invalid draft mode')
              if os.environ['CREATE_DRAFT'] == 'true': arguments.append('--create-draft')
              raise SystemExit(main(arguments))
      - name: Retain verification plan and draft delivery receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-office-delivery-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            draft-delivery/draft-plan.json
            draft-delivery/OpenGeul-Office-delivery-attestation.json
            draft-delivery/OpenGeul-Office-Guide-ko.txt
            draft-delivery/full-payload-verifier.log
            draft-delivery/server-delivery-receipt.json
            draft-delivery/OpenGeul-Office-Windows-job.log
            draft-delivery/suite-inventory.json
          retention-days: 7
          if-no-files-found: warn
