                  digest = item.get('digest', '')
                  maximum = 1024 * 1024 * 1024 if kind == 'package' else 128 * 1024 * 1024
                  require(not item.get('expired') and item.get('name') == name and item['workflow_run']['id'] == args.source_run
                          and item['workflow_run']['head_sha'] == args.source_head and digest.startswith('sha256:')
                          and SHA.fullmatch(digest[7:]) and 0 < item['size_in_bytes'] <= maximum,
