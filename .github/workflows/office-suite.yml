name: OpenGeul 공식 미러 속도 진단
'on':
  push:
    branches: [work/suite-network-probe]
permissions:
  contents: read
concurrency:
  group: office-suite-network-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-mirrors:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
    - name: 공식 Metalink에 등록된 MSI 미러의 중간 구간 최대 32 MiB 읽기
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        # URLs verified against the official per-file .meta4 on 2026-10-16:
        # https://download.documentfoundation.org/libreoffice/stable/26.8.1/win/x86_64/LibreOffice_26.8.1_Win_x86-64.msi.meta4
        # No checkout, caches, payload execution, retained payload or artifacts.
        $targets = @(
          @{ name = 'canonical'; url = 'https://download.documentfoundation.org/libreoffice/stable/26.8.1/win/x86_64/LibreOffice_26.8.1_Win_x86-64.msi' },
          @{ name = 'komogoto-fr'; url = 'https://mirrors.komogoto.com/tdf/libreoffice/stable/26.8.1/win/x86_64/LibreOffice_26.8.1_Win_x86-64.msi' },
          @{ name = 'clarkson-us'; url = 'https://mirror.clarkson.edu/tdf/libreoffice/stable/26.8.1/win/x86_64/LibreOffice_26.8.1_Win_x86-64.msi' },
          @{ name = 'fcix-us'; url = 'https://mirror.fcix.net/tdf/libreoffice/stable/26.8.1/win/x86_64/LibreOffice_26.8.1_Win_x86-64.msi' }
        )
        curl.exe --version
        foreach ($target in $targets) {
          $format = '{"mirror":"' + $target.name + '","size_download":%{size_download},"speed_download":%{speed_download},"time_total":%{time_total},"http_code":"%{http_code}","url_effective":"%{url_effective}","exitcode":%{exitcode}}\n'
          & curl.exe --silent --show-error --range 67108864-100663295 --max-time 30 --connect-timeout 10 --max-filesize 33554432 --location --output NUL --write-out $format $target.url
          Write-Host ('curl_exit=' + $LASTEXITCODE)
        }
