name: OpenGeul print accessibility investigation
on:
  push:
    branches: [work/print-accessibility-check]
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
jobs:
  inspect:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Load the exact prior PR4 binary for diagnostic-only verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          gh run download 37404480348 --repo ATLKR/OpenGeul --name opengeul-windows-x64-37404480348 --dir package
          gh run download 37404480348 --repo ATLKR/OpenGeul --name opengeul-e2e-inputs-37404480348 --dir inputs
          gh run download 37404480348 --repo ATLKR/OpenGeul --name opengeul-wasm-37404480348 --dir wasm-input
      - name: Validate full runtime parity and synthetic test inputs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          Start-Service Spooler
          Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction Stop
          python -m pip install -r e2e/print-requirements.txt
          python -m unittest discover -s e2e/print_tests -v
          ./e2e/ensure-webview2.ps1
          python e2e/prepare_payload.py package runtime
          node e2e/table_height.mjs generate wasm-input print-fixtures
          python e2e/print_fixtures.py print-fixtures
          node e2e/verify_print_fixtures.mjs wasm-input print-fixtures
      - name: Real semantic Print action and completed-spooler tests
        shell: pwsh
        run: python -u e2e/virtual_print.py --exe runtime/OpenGeul.exe --inputs inputs/e2e-fixtures --fixtures print-fixtures --out evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: print-accessibility-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: warn
