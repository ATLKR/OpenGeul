name: OpenGeul native automation diagnostic
on:
  push:
    branches: [work/e2e-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 15a12f271046b0fb8a17587878d9f0c44909eb0d
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify harness unit tests
        run: python -m unittest discover -s tests -v
      - name: Download original candidate and verify payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          gh run download 37332857367 --repo ATLKR/OpenGeul --name opengeul-windows-x64-37332857367 --dir inputs/dist
          gh run download 37332857367 --repo ATLKR/OpenGeul --name opengeul-e2e-inputs-37332857367 --dir inputs/fixtures
          python -m pip install -r e2e/requirements.txt
          ./e2e/ensure-webview2.ps1
          python e2e/prepare_payload.py inputs/dist runtime
      - name: Test all 14 native scenarios without rebuilding the prior app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          $env:E2E_MODE='native'
          $env:E2E_EXE=(Resolve-Path 'runtime/OpenGeul.exe').Path
          $env:E2E_FIXTURES=(Resolve-Path 'inputs/fixtures/e2e-fixtures').Path
          $env:E2E_OUTPUT=Join-Path $pwd 'evidence'
          python -u e2e/run.py
      - name: Preserve harness evidence, not a release gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-harness-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: warn
