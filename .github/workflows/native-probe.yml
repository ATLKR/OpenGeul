name: OpenGeul native automation diagnostic
on:
  push:
    branches: [work/e2e-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download exact candidate artifacts and verify payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          gh run download 37332857367 --repo ATLKR/OpenGeul --name opengeul-windows-x64-37332857367 --dir inputs/dist
          gh run download 37332857367 --repo ATLKR/OpenGeul --name opengeul-e2e-inputs-37332857367 --dir inputs/fixtures
          python -m pip install -r e2e/requirements.txt
          ./e2e/ensure-webview2.ps1
          python e2e/prepare_payload.py inputs/dist runtime
      - name: Inspect documented elevated-host debugging and Win32 dialogs
        run: python -u e2e/probe_native.py
      - name: Archive exact public source for review
        if: always() && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force source-review | Out-Null
          git fetch --depth=1 origin 4bdbd349da9b821a0a8b3192cf34b883d6f26915
          git archive --format=zip --output=source-review/composition-source.zip 4bdbd349da9b821a0a8b3192cf34b883d6f26915
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.os == 'windows-2022'
        with:
          name: source-review-${{ github.run_id }}
          path: source-review/
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnostic-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: warn
