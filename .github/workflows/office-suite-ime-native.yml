name: Suite actual native Korean IME diagnosis
'on':
  push:
    branches: [work/suite-ime-native]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: suite-ime-native-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  windows-suite:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Validate exact diagnostic source and Suite units
      shell: pwsh
      run: |
        $actual = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA -or $env:GITHUB_REF -cne 'refs/heads/work/suite-ime-native') { throw 'Exact isolated diagnostic source is required.' }
        python -m unittest discover -s suite/tests -v
        if ($LASTEXITCODE -ne 0) { throw 'Suite unit tests failed.' }
        dotnet run --project suite/shell-tests/OpenGeul.Office.Tests.csproj -c Release
        if ($LASTEXITCODE -ne 0) { throw 'Suite shell tests failed.' }
    - name: Install actual Korean IME from matching official offline media
      id: readiness
      shell: pwsh
      run: |
        python -m pip install pywinauto==0.6.9 Pillow==12.3.0
        if ($LASTEXITCODE -ne 0) { throw 'Actual UI prerequisites failed.' }
        ./suite/scripts/ensure-korean-ime.ps1 -Output .work/suite-korean-readiness
        if ($LASTEXITCODE -ne 0) { throw 'Actual Microsoft Korean IME readiness failed.' }
    - name: Preserve readiness and original servicing logs immediately
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-ime-native-readiness-${{ github.run_id }}
        include-hidden-files: true
        path: |
          .work/suite-korean-readiness/
          !.work/suite-korean-readiness/fod-source/**/*.cab
        retention-days: 1
        if-no-files-found: warn
        compression-level: 6
    - name: Build exact diagnostic package
      id: build
      if: '!cancelled() && steps.readiness.outcome == ''success'''
      shell: pwsh
      run: ./suite/scripts/build-suite.ps1
    - name: Create six actual engine fixtures
      id: fixtures
      if: '!cancelled() && steps.build.outcome == ''success'''
      shell: pwsh
      run: |
        $package = (Resolve-Path dist/OpenGeul-Office-0.1.1-dev-windows-x64).Path
        & "$package/Office/program/python.exe" suite/e2e/engine_smoke.py --suite $package --output .work/suite-engine
        if ($LASTEXITCODE -ne 0) { throw 'Actual engine fixtures failed.' }
    - name: Observe real Korean composition Backspace save and UNO reopen
      id: ime
      if: '!cancelled() && steps.fixtures.outcome == ''success'' && steps.readiness.outcome == ''success'''
      env:
        OPENGEUL_SUITE_DIAGNOSTICS: ${{ github.workspace }}/.work/suite-ime-native-worker-diagnostics
      shell: pwsh
      run: |
        python suite/e2e/korean_ime_smoke.py --suite dist/OpenGeul-Office-0.1.1-dev-windows-x64 --fixtures .work/suite-engine/fixtures --readiness .work/suite-korean-readiness/readiness.json --output .work/suite-korean-ime
        if ($LASTEXITCODE -ne 0) { throw 'Actual Korean IME composition and persisted content failed.' }
    - name: Preserve original IME receipts immediately
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-ime-native-receipts-${{ github.run_id }}
        include-hidden-files: true
        path: |
          .work/suite-korean-ime/
          .work/suite-ime-native-worker-diagnostics/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 6
    - name: Preserve all raw diagnostic evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-ime-native-all-${{ github.run_id }}
        include-hidden-files: true
        path: |
          .work/suite-korean-readiness/
          !.work/suite-korean-readiness/fod-source/**/*.cab
          .work/suite-korean-ime/
          .work/suite-ime-native-worker-diagnostics/
          .work/suite-engine/
          .work/office-suite/msi.msi.log
        retention-days: 1
        if-no-files-found: warn
        compression-level: 6
