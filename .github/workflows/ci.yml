name: OpenGeul policy tests
'on':
  push:
    branches: [main]
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Audit free-only CI config and regression tests
      run: |
        python -m pip install -r ci/requirements.txt
        python ci/policy.py
        python -m unittest discover -s ci/tests -v
    - name: Test policy and package verification
      run: python3 -m unittest discover -s tests -v
    - name: Test the standalone font metadata parser
      run: |
        rustc --edition=2021 --test overlay/font_policy.rs -o /tmp/opengeul-font-tests
        /tmp/opengeul-font-tests
    if: github.event.repository.private == false
concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true
