name: OpenGeul policy tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test policy and package verification
        run: python3 -m unittest discover -s tests -v
      - name: Test the standalone font metadata parser
        run: |
          rustc --edition=2021 --test overlay/font_policy.rs -o /tmp/opengeul-font-tests
          /tmp/opengeul-font-tests
