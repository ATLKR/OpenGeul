name: OpenGeul ARM64 native Korean prerequisites
'on':
  push:
    branches: [work/opengeul-office-arm64-readiness]
    paths:
      - .github/workflows/office-arm64-ime-prerequisites.yml
      - suite/scripts/ensure-korean-ime.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-suite:
    runs-on: windows-11-arm
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Native ARM64 automation dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .work/suite-korean-readiness | Out-Null
          python -m pip install pywinauto==0.6.9 Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 automation prerequisites failed.' }
          python -c "import platform,pywinauto,PIL; print(platform.machine(),pywinauto.__version__,PIL.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 automation imports failed.' }
      - name: Check the native preparation deadline contract
        shell: pwsh
        run: |
          python -m unittest suite.tests.test_suite_korean_architecture -v
          if ($LASTEXITCODE -ne 0) { throw 'Native Korean preparation boundary tests failed.' }
      - name: Actual native Microsoft Korean input method preparation
        shell: pwsh
        run: |
          ./suite/scripts/ensure-korean-ime.ps1 -Architecture arm64 -Output .work/suite-korean-readiness
          if ($LASTEXITCODE -ne 0) { throw 'Actual ARM64 Korean input method preparation failed.' }
      - name: Preserve original prerequisite observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-arm64-korean-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/suite-korean-readiness/
            !.work/suite-korean-readiness/fod-source/**/*.cab
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
