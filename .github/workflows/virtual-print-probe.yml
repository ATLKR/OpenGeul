name: OpenGeul virtual printer probe
on:
  push:
    branches: [work/virtual-printer-e2e]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: virtual-print-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  printing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ensure the inbox virtual printer on this disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required.' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          Start-Transcript -Path evidence/printer-capability.txt
          try {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber
            $feature=Get-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features
            if ($feature.State -ne 'Enabled') {
              $enabled=Enable-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -All -NoRestart
              if ($enabled.RestartNeeded) { throw 'Printer enablement needs reboot.' }
            }
            Start-Service Spooler
            if (-not (Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction SilentlyContinue)) { Add-PrinterDriver -Name 'Microsoft Print To PDF' }
          } finally { Stop-Transcript }
      - name: Reuse a successful immutable main binary only for the isolated harness probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          $run=gh api repos/ATLKR/OpenGeul/actions/runs/37399457757 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne '642b7a0e6f681006b013fea6117071c189fa28e1') { throw 'Wrong probe payload provenance.' }
          gh run download 37399457757 --repo ATLKR/OpenGeul --name opengeul-windows-x64-37399457757 --dir package
          gh run download 37399457757 --repo ATLKR/OpenGeul --name opengeul-wasm-37399457757 --dir wasm
      - name: Validate output oracles and immutable inputs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          $env:PYTHONUTF8='1'
          python -m pip install -r e2e/requirements.txt -r e2e/printing/requirements.txt
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/printing -v
          ./e2e/ensure-webview2.ps1
          python e2e/prepare_payload.py package runtime
          python e2e/printing/verify_inputs.py package wasm 642b7a0e6f681006b013fea6117071c189fa28e1 37399457757
          node e2e/printing/generate.mjs wasm inputs/print-fixtures
      - name: Real Print command, isolated Windows spooler and output validation
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference=$true
          $env:PYTHONUTF8='1'
          $env:PRINT_OUTPUT=Join-Path $pwd 'evidence/printing'
          $env:PRINT_FIXTURES=(Resolve-Path inputs/print-fixtures).Path
          $env:E2E_EXE=(Resolve-Path runtime/OpenGeul.exe).Path
          $env:PRINT_PAYLOAD_RUN='37399457757'
          python e2e/printing/run_print.py
      - name: Preserve exact public test sources for diagnosis
        if: always()
        shell: pwsh
        run: git archive --format=zip --output=evidence/checkout.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: virtual-print-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
