name: Native28 ARM64 ATL library path receiver control
'on':
  push:
    branches: [work/opengeul-office-native28-atl-path-control]
    paths:
      - .github/workflows/office-native-atl-path-control.yml
      - suite/scripts/probe-native-atl-path-control.ps1
      - suite/diagnostics/native-atl-source/**
      - suite/tests/test_native_atl_path_control.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed diagnostic source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native28-atl-path-control
  cancel-in-progress: false
jobs:
  native-atl-path-control:
    if: github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/work/opengeul-office-native28-atl-path-control' && (github.event_name == 'push' || inputs.source_sha == github.sha)
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Reserve evidence finalization before checkout
        shell: pwsh
        run: |
          $started=[DateTime]::UtcNow
          $deadline=$started.AddMinutes(15).ToString('o',[Globalization.CultureInfo]::InvariantCulture)
          $owned=Join-Path $env:RUNNER_TEMP ('native28-atl-budget-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $owned){throw 'Preserve original budget namespace.'}
          New-Item -ItemType Directory $owned|Out-Null
          $receipt=Join-Path $owned 'job-budget.json'
          [ordered]@{schemaVersion=1;origin='first-user-step';startedUtc=$started.ToString('o');deadlineUtc=$deadline;controlMinutes=15;jobTimeoutMinutes=20;nominalReserveMinutes=5;runnerSetupIncluded=$false}|ConvertTo-Json|Set-Content -LiteralPath $receipt -Encoding utf8NoBOM
          "OPENGEUL_ATL_PATH_DEADLINE_UTC=$deadline"|Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "OPENGEUL_ATL_PATH_BUDGET_RECEIPT=$receipt"|Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "OPENGEUL_ATL_PATH_BUDGET_ROOT=$owned"|Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare one native object with two direct LINK path receivers
        shell: pwsh
        run: |
          ./suite/scripts/probe-native-atl-path-control.ps1 -DeadlineUtc $env:OPENGEUL_ATL_PATH_DEADLINE_UTC
          if(-not $?){throw 'Path measurement is incomplete; retain original diagnostics.'}
      - name: Retain own raw control evidence on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-native28-atl-path-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/native28-atl-evidence/
            ${{ runner.temp }}/native28-atl-budget-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
