name: OpenGeul focused PPTX geometry compatibility E2E
'on':
  push:
    branches: [work/opengeul-office-feature-e2e]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  office-features-x64:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install independently pinned PDF verifier
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r suite/config/pdf-e2e-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PDF verification tooling installation failed.' }
      - name: Verify semantic fixture, cleanup and PDF regressions
        shell: pwsh
        run: |
          python -m unittest suite.tests.test_office_feature_smoke suite.tests.test_office_feature_fixtures suite.tests.test_engine_smoke suite.tests.test_pdf_export_smoke suite.tests.test_pptx_geometry_contract -v
          if ($LASTEXITCODE -ne 0) { throw 'Office feature and PDF boundary tests failed.' }
      - name: Build the pinned Suite package
        id: build
        shell: pwsh
        run: |
          $lock = Get-Content suite/config/runtime.lock.json -Raw | ConvertFrom-Json
          if ($lock.architecture -cne 'x64' -or $lock.version -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+-dev\z') { throw 'Unexpected Suite identity.' }
          "SUITE_PACKAGE=dist/OpenGeul-Office-$($lock.version)-windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./suite/scripts/build-suite.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Suite package build failed.' }
      - name: Verify the two originally failing PPTX cases with exact package and native geometry
        if: '!cancelled() && steps.build.outcome == ''success'''
        shell: pwsh
        run: |
          $package = (Resolve-Path $env:SUITE_PACKAGE).Path
          $runner = Join-Path $env:RUNNER_TEMP 'opengeul-focused-pptx.py'
          @'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,str(Path(sys.argv[3])/'suite/e2e'))
          import office_feature_smoke as feature
          from engine_smoke import write_json
          suite,output=feature.prepare_output(Path(sys.argv[1]),Path(sys.argv[2]))
          manifest=json.loads((suite/'suite-product.json').read_text(encoding='utf-8-sig'))
          assert manifest['schemaVersion']==1
          feature.validate_modules(manifest['modules'])
          ids=('format-impress-pptx','rich-impress')
          cases=[case for case in feature.case_specs() if case['id'] in ids]
          assert tuple(case['id'] for case in cases)==ids
          records=[]
          for case in cases:
              record=feature.run_case(suite,output,case)
              records.append(record)
              write_json(output/(case['id']+'.json'),record)
              print(case['id']+': '+record['status'],flush=True)
          passed=len(records)==2 and all(record['status']=='passed' and record['independentReopenVerified'] and len(record['packageGeometryChecks'])==2 for record in records)
          report=dict(schemaVersion=1,kind='focused-pptx-geometry-compatibility',passed=passed,expectedCaseCount=2,completedCaseCount=len(records),caseIds=list(ids),guiVerified=False,full21CaseQualification=False,cases=records)
          write_json(output/'focused-pptx.json',report)
          raise SystemExit(0 if passed else 1)
          '@ | Set-Content -LiteralPath $runner -Encoding utf8NoBOM
          & "$package/Office/program/python.exe" $runner $package (Join-Path $env:GITHUB_WORKSPACE '.work/suite-pptx-geometry') $env:GITHUB_WORKSPACE
          $focusedExit = $LASTEXITCODE
          python suite/scripts/verify-suite.py $package
          $integrityExit = $LASTEXITCODE
          if ($focusedExit -ne 0 -or $integrityExit -ne 0) { throw "Focused PPTX failed: cases=$focusedExit integrity=$integrityExit" }
      - name: Preserve original Office fixtures, PDFs and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-office-pptx-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/suite-pptx-geometry/
            dist/**/suite-inventory.json
            dist/**/suite-provenance.json
            dist/**/runtime-branding.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
