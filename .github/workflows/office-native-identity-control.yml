name: Native30 ARM64 bounded installed identity control
'on':
  push:
    branches: [work/opengeul-office-native30-identity-control]
    paths:
      - .github/workflows/office-native-identity-control.yml
      - suite/scripts/probe-native-identity-control.ps1
      - suite/diagnostics/native-runtime-identity/**
      - suite/tests/test_native_identity_control.py
      - suite/scripts/build-native-engine.ps1
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
      source_tree:
        description: Exact reviewed diagnostic tree
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native30-bounded-identity-control
  cancel-in-progress: false
jobs:
  native-identity-control:
    if: github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/work/opengeul-office-native30-identity-control' && (github.event_name == 'push' || inputs.source_sha == github.sha)
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Establish one deadline before checkout and reserve evidence upload
        shell: pwsh
        run: |
          $started=[DateTime]::UtcNow
          $deadline=$started.AddMinutes(15).ToString('o',[Globalization.CultureInfo]::InvariantCulture)
          $owned=Join-Path $env:RUNNER_TEMP ('native30-identity-budget-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $owned){throw 'Preserve original budget namespace.'}
          New-Item -ItemType Directory $owned|Out-Null
          $receipt=Join-Path $owned 'job-budget.json'
          [ordered]@{schemaVersion=1;origin='first-user-step';startedUtc=$started.ToString('o');deadlineUtc=$deadline;controlMinutes=15;jobTimeoutMinutes=20;nominalReserveMinutes=5;runnerSetupIncluded=$false}|ConvertTo-Json|Set-Content -LiteralPath $receipt -Encoding utf8NoBOM
          "OPENGEUL_IDENTITY_CONTROL_DEADLINE_UTC=$deadline"|Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "OPENGEUL_IDENTITY_CONTROL_BUDGET_RECEIPT=$receipt"|Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Generate authentic finite identities and replay reviewed P and exact C
        shell: pwsh
        env:
          IDENTITY_EXPECTED_SOURCE_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.source_sha }}
          IDENTITY_EXPECTED_SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          ./suite/scripts/probe-native-identity-control.ps1 -DeadlineUtc $env:OPENGEUL_IDENTITY_CONTROL_DEADLINE_UTC -ExpectedSourceCommit $env:IDENTITY_EXPECTED_SOURCE_COMMIT -ExpectedSourceTree $env:IDENTITY_EXPECTED_SOURCE_TREE
          if(-not $?){throw 'Bounded identity control incomplete; retain all diagnostics.'}
      - name: Retain bounded raw identity diagnostics on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-native30-identity-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/native30-identity-evidence/
            ${{ runner.temp }}/native30-identity-budget-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
