name: OpenGeul 네이티브 COM 격리 진단
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: opengeul-native-com-diagnostic
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  native-com:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/native-com-113' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1)
    name: Native COM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
    - name: Windows에서 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: x64
    - name: 진단 소스와 네이티브 Rust 호스트 확인
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
        $arch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'x64' }
        $target = if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
        $toolchain = "1.93.1-$target"
        rustup toolchain install $toolchain --profile minimal
        rustup run $toolchain rustc --version --verbose
        "OPENGEUL_DIAG_ARCH=$arch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENGEUL_DIAG_TARGET=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENGEUL_DIAG_TOOLCHAIN=$toolchain" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: 실제 SCM worker와 표준입출력·충돌 격리 검사
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        python ci/com_worker_smoke.py --architecture $env:OPENGEUL_DIAG_ARCH --target $env:OPENGEUL_DIAG_TARGET --toolchain $env:OPENGEUL_DIAG_TOOLCHAIN --output com-smoke
    - name: 원본 진단 자료의 크기 제한 확인
      if: always()
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 32 com-smoke
    - name: 원본 Windows COM 진단 자료 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-com-smoke-${{ matrix.os }}-${{ github.run_id }}
        path: com-smoke/*
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
