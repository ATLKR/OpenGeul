name: Store70 동일 원본·동일 SID API 재개
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opengeul-store
  cancel-in-progress: false
  queue: max
jobs:
  resume-store70:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/store70-resume' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 고정 Store70 원본 ZIP·6개 성공 gate·실패한 제출 실행 검증
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/store_resume70.py --download store-output
          python ci/evidence.py size --limit-mib 96 store-output
      - name: 변경되지 않은 canonical Source87 원본22 GET 검증
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/store_package.py --download-source-release --release-tag v1.1.3 --output .work/store-source
          python ci/evidence.py size --limit-mib 192 .work/store-source
      - name: 같은 SID와 같은 두 패키지를 한 번 업로드·커밋
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: python scripts/store_submit.py --release-tag v1.1.3 --package-directory store-output --resume-store70
