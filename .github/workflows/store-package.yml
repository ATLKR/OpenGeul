name: OpenGeul 소유자 삭제 관측과 journal 단일 복구
'on':
  workflow_dispatch:
    inputs:
      confirm_owner_deleted_pending_id:
        description: 소유자가 대시보드에서 삭제한 미게시 SID1152921505702100805 확인
        type: string
        required: true
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: opengeul-store
  cancel-in-progress: false
  queue: max
env:
  PYTHONUTF8: '1'
jobs:
  reconcile:
    if: github.event.repository.private == false && github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/store-owner-delete-reconcile-113' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1 && inputs.confirm_owner_deleted_pending_id == '1152921505702100805'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Store GET 전용·원본 claim 보존·단일 journal PATCH 경계 검사
        run: python -m unittest discover -s tests -p test_store_owner_delete_reconcile.py -v
      - name: 소유자 삭제를 실제 GET으로 관측하고 역사 보존 후 journal만 복구
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          CONFIRM_OWNER_DELETED_PENDING_ID: ${{ inputs.confirm_owner_deleted_pending_id }}
        run: python scripts/store_owner_delete_reconcile.py --output-dir store-owner-delete-reconciliation
      - name: API ACK를 주장하지 않는 제한된 JSON 관측만 하루 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-store-owner-delete-reconciliation-${{ github.run_id }}
          path: |
            store-owner-delete-reconciliation/external-delete-observation.json
            store-owner-delete-reconciliation/journal-reconciliation.json
          retention-days: 1
          if-no-files-found: warn
