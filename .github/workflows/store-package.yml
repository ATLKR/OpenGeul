name: OpenGeul 고정 미게시 초안 단일 DELETE 진단
'on':
  workflow_dispatch:
    inputs:
      delete_pending_id:
        description: 승인된 미게시 초안 SID1152921505702100805만 입력
        type: string
        required: true
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: opengeul-store
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  delete-diagnostic:
    if: github.event.repository.private == false && github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/store-delete-reason-113' && github.actor == 'ATLKR' && github.run_attempt == 1 && inputs.delete_pending_id == '1152921505702100805'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 단일 DELETE 경계·거부 조건·응답 비밀 제거 검사
        run: |
          python -m unittest discover -s tests -p test_store_delete_diagnostic.py -v
          python -m unittest discover -s tests -p test_store_pending_observe.py -v
          python -m unittest discover -s tests -p test_store_status_diagnostics.py -v
      - name: 정확한 초안·공개 기준·journal 검증 뒤 DELETE 한 번과 제한된 응답 진단
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          DELETE_PENDING_ID: ${{ inputs.delete_pending_id }}
        run: python scripts/store_delete_diagnostic.py --output-dir store-delete-diagnostic
      - name: 비밀·URL·원문 없는 JSON만 하루 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-store-delete-diagnostic-${{ github.run_id }}
          path: |
            store-delete-diagnostic/pre-delete-intent.json
            store-delete-diagnostic/delete-diagnostic.json
          retention-days: 1
          if-no-files-found: warn
