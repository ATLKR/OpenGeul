name: ARM hosted runner 읽기 전용 관찰
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.event.repository.private == false && github.actor == 'ATLKR' && github.ref == 'refs/heads/diagnostic/arm-runner-ready71'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: 읽기 전용 Windows UIA·화면 관찰 도구
        shell: pwsh
        run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0
      - name: 실제 ARM host·소유 창·서명·foreground 한 번 관찰
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python e2e/runner-ready.py --prepare --output runner-ready
      - name: 관찰 원본만 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-ready-arm64-${{ github.run_id }}
          path: runner-ready/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
