name: OpenGeul 대기 Store 제출 읽기 전용 관찰
'on':
  workflow_dispatch:
    inputs:
      expected_pending_id:
        description: 먼저 관찰한 대기 제출 ID와 일치해야 함; 비우면 현재 ID를 조회
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: opengeul-store-pending-readonly
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  observe:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/store-pending-113')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 실제 GET 경계와 비밀·URL 출력 차단 회귀 검사
        run: python -m unittest discover -s tests -p test_store_pending_observe.py -v
      - name: 고정 실패 실행의 공식 로그 바이트 SHA만 관찰
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, re, os
          from pathlib import Path
          r = subprocess.run(['gh', 'api', 'repos/ATLKR/OpenGeul/actions/jobs/115007617322/logs'], capture_output=True, timeout=120)
          result = {'jobId': 115007617322, 'returncode': r.returncode, 'storeMutationsAttempted': False}
          if r.returncode == 0:
              result.update(bytes=len(r.stdout), sha256=hashlib.sha256(r.stdout).hexdigest(), matchesRetainedOriginal=len(r.stdout)==16981 and hashlib.sha256(r.stdout).hexdigest()=='1858029bdb6c40fb10f3114504c07ca4456b9b449e2c03d584f92bd1affcde81')
          else:
              error=r.stderr.decode('utf-8',errors='replace')
              hints=['Resource not accessible by integration','Must have admin rights to Repository','Not Found','Forbidden','unable to parse response','failed to run','HTTP 403','HTTP 404','HTTP 410','HTTP 502','HTTP 503']
              result.update(stderrBytes=len(r.stderr),stderrSha256=hashlib.sha256(r.stderr).hexdigest(),httpStatusCodes=sorted(set(re.findall(r'HTTP (\d{3})',error))),knownHints=[hint for hint in hints if hint in error])
              if len(r.stderr)<=1024:
                  message=error.replace(os.environ.get('GH_TOKEN','') or 'UNSET_TOKEN_SENTINEL','[redacted]')
                  message=re.sub(r'https?://\S+','[redacted-url]',message)
                  message=re.sub(r'(?i)bearer\s+\S+','[redacted-auth]',message)
                  message=re.sub(r'[A-Za-z0-9_+/=.-]{24,}','[redacted-long-value]',message)
                  result['boundedRedactedCliDiagnostic']=message
          Path('store-failure-log-byte-observation.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: 현재 대기 제출과 공개 기준을 읽기만 수행
        env:
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          EXPECTED_PENDING_ID: ${{ inputs.expected_pending_id }}
        run: python scripts/store_pending_observe.py --expected-pending-id "$EXPECTED_PENDING_ID" --output store-pending-observation.json
      - name: 제한된 관측 필드만 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-store-pending-state-${{ github.run_id }}
          path: |
            store-pending-observation.json
            store-failure-log-byte-observation.json
          retention-days: 1
          if-no-files-found: warn
