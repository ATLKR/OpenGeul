name: WACK SDK 읽기 전용 조사
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opengeul-wack-sdk-inspect-113
  cancel-in-progress: false
jobs:
  inspect-sdk:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' && github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/wack-sdk-inspect-113' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 고정 경로와 읽기 전용 예산 검증
        run: python -m unittest discover -s probe -p test_wack_sdk_inspect.py -v
      - name: SDK 원본 바이트와 수동 IL 역어셈블 증거 수집
        run: python probe/wack_sdk_inspect.py
      - name: SDK 증거만 하루 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-wack-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wack-sdk-inspect/
            wack-sdk-inspect-failure.json
          retention-days: 1
          if-no-files-found: error
