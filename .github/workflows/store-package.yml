name: OpenGeul Source61 password diagnostic
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Run all eight password cases against failed Source61 bytes without qualifying a source release
        type: choice
        options: [password]
        default: password
        required: true
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  GIT_LFS_SKIP_SMUDGE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  password:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/native-password-61' && github.event_name == 'workflow_dispatch' && inputs.mode == 'password')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, windows-2025]
    steps:
    - name: Preserve exact source bytes for fixture provenance
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Verify and download only immutable Package61 and same-run WASM61
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: python probe/download-package61.py --output evidence/source.json
    - name: Prepare the existing public GUI automation tools
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        python -m pip install -r e2e/requirements.txt
        ./e2e/ensure-webview2.ps1
    - name: Generate ephemeral synthetic inputs through the unchanged source-bound public generator
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        node e2e/generate-browser-fixtures.mjs fixture-hop smoke-fixtures
        node e2e/password/generate-password-fixtures.mjs fixture-hop/apps/studio-host/vendor/rhwp-core smoke-fixtures password-fixtures
    - name: Run every original password case with the reviewed selector fix
      shell: pwsh
      env:
        DIAGNOSTIC_OS: ${{ matrix.os }}
      run: python probe/password-suite61.py
    - name: Preserve bounded diagnostic metadata without documents or font programs
      if: always()
      shell: pwsh
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      run: python ci/evidence.py pack evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-password61-${{ matrix.os }}-${{ github.run_id }}
        path: bounded-evidence/
        retention-days: 1
        if-no-files-found: warn
        compression-level: 9
