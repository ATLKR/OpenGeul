name: 공식 WACK 호스트 진단 (제품·제출 검증 아님)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stock-wack-host:
    if: github.event.repository.private == false && github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/wack-host-75'
    strategy:
      fail-fast: false
      matrix:
        include:
        - mode: arm-inventory-install
          os: windows-11-arm
        - mode: x64-inspect-arm
          os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: x64
    - name: 원래 Microsoft 도구·공개 원본만 진단
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./e2e/wack-host-diagnostic.ps1 -Mode '${{ matrix.mode }}'
    - name: 원본 증거 크기 검사
      id: evidence-size
      if: always()
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 16 wack-host-evidence
    - name: SDK·원본 로그·변경하지 않은 보고서 보존
      if: always() && steps.evidence-size.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wack-host-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: wack-host-evidence/
        retention-days: 1
        if-no-files-found: error
        compression-level: 6
