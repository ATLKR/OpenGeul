name: OpenGeul 네이티브 파일·폴더 활성화 진단
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: opengeul-native-open-diagnostic
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  native-open:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/diagnostic/native-open-113' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt
      == 1)
    name: 실제 기본 앱 활성화 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
        - windows-2025
        - windows-11-arm
    steps:
    - name: Windows에서 정확한 소스 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: x64
    - name: 실제 소스·실행 신원과 native Rust 도구 연결
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $head = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
        $arch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'x64' }
        $target = if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
        $toolchain = "1.93.1-$target"
        $output = Join-Path $env:GITHUB_WORKSPACE 'native-open-evidence'
        $cargoTarget = Join-Path $env:GITHUB_WORKSPACE '.work/native-open-probe-target'
        New-Item -ItemType Directory -Path $output | Out-Null
        $sources = @{}
        $files = @(Get-ChildItem overlay/native-open -Recurse -File) + @(Get-ChildItem overlay/native-open-probe -Recurse -File) + @(Get-Item e2e/native_activation_probe.py, e2e/native_architecture.py, scripts/windows_arch.py, scripts/releasekit.py)
        foreach ($file in $files) {
          $relative = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $file.FullName).Replace('\', '/')
          $sources[$relative] = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        }
        $stamp = [ordered]@{
          formatVersion = 1; sourceCommit = $head; sourceRef = $env:GITHUB_REF;
          runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT;
          actor = $env:GITHUB_ACTOR; triggeringActor = $env:GITHUB_TRIGGERING_ACTOR;
          architecture = $arch; target = $target; toolchain = $toolchain;
          runnerOs = $env:RUNNER_OS; runnerArchitecture = $env:RUNNER_ARCH;
          workflowSha256 = (Get-FileHash .github/workflows/store-package.yml -Algorithm SHA256).Hash.ToLowerInvariant();
          sourceFiles = $sources; cargoTargetDirectory = $cargoTarget;
          uriEnabled = $false; storeSubmissionPerformed = $false;
          packagedApplicationVerified = $false; externalRenderingVerified = $false
        }
        [System.IO.File]::WriteAllText((Join-Path $output 'source-stamp.json'), ($stamp | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
        "OPENGEUL_DIAG_ARCH=$arch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENGEUL_DIAG_TARGET=$target" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENGEUL_DIAG_TOOLCHAIN=$toolchain" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "CARGO_TARGET_DIR=$cargoTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        rustup toolchain install $toolchain --profile minimal 1> (Join-Path $output 'rustup.stdout.log') 2> (Join-Path $output 'rustup.stderr.log')
        $code = $LASTEXITCODE
        $code | Out-File (Join-Path $output 'rustup.exit.txt') -Encoding utf8
        if ($code -ne 0) { throw "Native toolchain install failed: $code" }
        rustup run $toolchain rustc --version --verbose 1> (Join-Path $output 'rustc.stdout.log') 2> (Join-Path $output 'rustc.stderr.log')
        $code = $LASTEXITCODE
        $code | Out-File (Join-Path $output 'rustc.exit.txt') -Encoding utf8
        if ($code -ne 0) { throw "Native rustc query failed: $code" }
        $version = Get-Content (Join-Path $output 'rustc.stdout.log') -Raw
        if ($version -notmatch '(?m)^release: 1\.93\.1\s*$' -or $version -notmatch "(?m)^host: $([regex]::Escape($target))\s*$") { throw 'Actual Rust host/version mismatch' }
    - name: 제품과 분리된 정확한 native probe 빌드
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $output = Join-Path $env:GITHUB_WORKSPACE 'native-open-evidence'
        rustup run $env:OPENGEUL_DIAG_TOOLCHAIN cargo build --locked --manifest-path overlay/native-open-probe/Cargo.toml --target $env:OPENGEUL_DIAG_TARGET 1> (Join-Path $output 'cargo.stdout.log') 2> (Join-Path $output 'cargo.stderr.log')
        $code = $LASTEXITCODE
        $code | Out-File (Join-Path $output 'cargo.exit.txt') -Encoding utf8
        if ($code -ne 0) { throw "Native probe build failed: $code" }
        $binary = Join-Path $env:CARGO_TARGET_DIR "$env:OPENGEUL_DIAG_TARGET/debug/opengeul-native-open-probe.exe"
        Copy-Item $binary (Join-Path $output 'opengeul-native-open-probe.exe')
        $identity = [ordered]@{ sourceCommit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; architecture = $env:OPENGEUL_DIAG_ARCH; target = $env:OPENGEUL_DIAG_TARGET; toolchain = $env:OPENGEUL_DIAG_TOOLCHAIN; sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant(); bytes = (Get-Item $binary).Length }
        [System.IO.File]::WriteAllText((Join-Path $output 'binary-identity.json'), ($identity | ConvertTo-Json -Depth 4), [System.Text.UTF8Encoding]::new($false))
    - name: 실제 native PID·소유 STA 창에서 합성 파일·폴더만 열기
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $output = Join-Path $env:GITHUB_WORKSPACE 'native-open-evidence'
        $binary = Join-Path $output 'opengeul-native-open-probe.exe'
        python e2e/native_activation_probe.py --binary $binary --architecture $env:OPENGEUL_DIAG_ARCH --output-dir (Join-Path $output 'observation') --timeout-seconds 60 1> (Join-Path $output 'controller.stdout.log') 2> (Join-Path $output 'controller.stderr.log')
        $code = $LASTEXITCODE
        $code | Out-File (Join-Path $output 'controller.exit.txt') -Encoding utf8
        if ($code -ne 0) { throw "Actual Launcher observation failed: $code" }
    - name: 실패 원본과 정확한 파일 바이트 증명 보존
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE 'native-open-evidence'
        if (-not (Test-Path $output -PathType Container)) { throw 'Actual diagnostic evidence is absent' }
        $status = [ordered]@{ sourceCommit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT; architecture = $env:OPENGEUL_DIAG_ARCH; jobStatus = $env:ACTUAL_JOB_STATUS; uriEnabled = $false; storeSubmissionPerformed = $false }
        [System.IO.File]::WriteAllText((Join-Path $output 'actual-job-status.json'), ($status | ConvertTo-Json -Depth 4), [System.Text.UTF8Encoding]::new($false))
        $bindings = @()
        foreach ($file in (Get-ChildItem $output -Recurse -File | Sort-Object FullName)) {
          $relative = [System.IO.Path]::GetRelativePath($output, $file.FullName).Replace('\', '/')
          $bindings += [ordered]@{ path = $relative; bytes = $file.Length; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
        }
        [System.IO.File]::WriteAllText((Join-Path $output 'evidence-bindings.json'), ($bindings | ConvertTo-Json -Depth 4), [System.Text.UTF8Encoding]::new($false))
      if: always()
      env:
        ACTUAL_JOB_STATUS: ${{ job.status }}
    - name: 업로드 전 원본 자료의 32 MiB 제한 확인
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 32 native-open-evidence
      id: cap
      if: always()
    - name: 두 아키텍처의 원본 Windows 진단 자료 보존
      if: always() && steps.cap.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-native-open-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: native-open-evidence/*
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
