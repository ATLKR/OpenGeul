name: OpenGeul Store 원본 보관 준비
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opengeul-archive-next-conditional
  cancel-in-progress: false
jobs:
  upload-originals-to-draft:
    # 실제 핀과 root 실행 허가 검토 전에는 runner/checkout도 시작하지 않는다.
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/archive-next-conditional' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 0
        submodules: false
        lfs: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 고정 원본을 검증하고 별도 draft의 누락 파일만 전송
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python probe/archive_next.py
    - name: 공개하지 않은 보관 전송 영수증 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-archive-next-${{ github.run_id }}-${{ github.run_attempt }}
        path: archive-next-transfer-receipt.json
        retention-days: 1
        if-no-files-found: warn
