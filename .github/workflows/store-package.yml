name: OpenGeul archive64 upload diagnostic
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
      verify_store_api:
        type: boolean
        default: false
      submit_to_store:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: opengeul-archive64-upload
  cancel-in-progress: false
jobs:
  upload-originals-to-draft:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/archive-upload64' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v1.1.2-dev.64.1' && !inputs.verify_store_api && !inputs.submit_to_store)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Validate exact original Store ZIP and upload only missing assets to fixed draft
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: python probe/archive-upload64.py
