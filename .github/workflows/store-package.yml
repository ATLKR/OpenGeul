name: OpenGeul Windows Store 업데이트 HTTPS 진단 준비
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: opengeul-windows-update-https-diagnostic
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  windows-update-https:
    # 전체 성공한 Source68 원본 핀을 검토한 읽기 전용 단일 진단 실행.
    if: ${{ github.event.repository.private == false && github.repository == 'ATLKR/OpenGeul' && github.actor == 'ATLKR' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/diag-windows-store-update-68' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 승인된 고정 원본의 전체 성공·여섯 자산·런타임 일치 확인
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        python scripts/windows_update_source.py
    - name: 기존 검토된 네이티브 UI 의존성 준비
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        python -m pip install -r e2e/requirements.txt
        ./e2e/ensure-webview2.ps1
    - name: 원본 GUI의 실제 수동 확인 IPC 한 번 관측
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        python e2e/windows_update_probe.py
    - name: 짧은 진단 증거 보존
      if: always() && hashFiles('.work/windows-update-probe/qa/probe.json') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-update-https-${{ github.run_id }}-attempt1
        path: .work/windows-update-probe/qa/*
        retention-days: 1
        if-no-files-found: error
        compression-level: 9
