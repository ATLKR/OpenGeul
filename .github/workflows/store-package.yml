name: Source87 런타임 ARM 저장 소유권 실제 인쇄 진단
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-print-physical-ready71
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  observe:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.actor == 'ATLKR' && github.run_attempt == 1 && github.ref == 'refs/heads/diagnostic/arm-runner-ready71')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-11-arm]
    env:
      E2E_ARCHITECTURE: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
    steps:
    - name: 기존 Windows 시험과 동일한 체크아웃 설정
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        architecture: x64
    - name: 원래 독립 인쇄 검사와 Microsoft PDF 드라이버 준비
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference=$true
        Start-Service Spooler
        Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction Stop | Out-Null
        python -m pip install -r e2e/print-requirements.txt
        python -m unittest discover -s e2e/print_tests -v
        ./e2e/ensure-webview2.ps1
    - name: 고정 Source87 전체 런타임·합성 입력 검증
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -u ci/native_print_physical_diagnostic.py --prepare
    - name: 검증된 ARM OS 창과 전경 준비
      if: matrix.os == 'windows-11-arm'
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        python e2e/runner-ready.py --prepare --output runner-ready
    - name: 원래 실제 Preferences·스풀러·PDF·취소 8건 실행
      shell: pwsh
      run: python -u e2e/virtual_print.py --exe .work/physical-print/runtime/OpenGeul.exe --inputs inputs/e2e-fixtures --fixtures print-fixtures --out print-evidence
    - name: 진단 전용 고정 PDF7개·guard 원본 결합
      if: always()
      shell: pwsh
      run: python -u ci/native_print_physical_diagnostic.py --collect
    - name: 원래 실패 상태를 유지하여 인쇄 원본 크기 제한
      if: always()
      shell: pwsh
      env:
        EVIDENCE_STATUS: ${{ job.status }}
      run: python ci/evidence.py pack print-evidence bounded-evidence --status $env:EVIDENCE_STATUS
    - name: 진단 전체 전송 상한 확인
      id: bounded-evidence
      if: always()
      shell: pwsh
      run: python ci/evidence.py size --limit-mib 24 bounded-evidence diagnostic-evidence
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && steps.bounded-evidence.outcome == 'success'
      with:
        name: native-print-physical-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          bounded-evidence/
          diagnostic-evidence/
        if-no-files-found: warn
        retention-days: 1
        compression-level: 9
