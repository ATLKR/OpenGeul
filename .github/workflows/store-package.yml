name: OpenGeul 일회 bot webhook 진단
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opengeul-store-bot-push-once
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  probe:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/store-bot-push-once' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 고정 공개 JSON의 끝 줄바꿈만 한 번 갱신
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
      run: python probe/store_bot_push_once.py
    - name: 민감정보 없는 진단 결과 보존
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-bot-push-once-${{ github.run_id }}-${{ github.run_attempt }}
        path: bot-push-receipt.json
        if-no-files-found: error
        retention-days: 1
