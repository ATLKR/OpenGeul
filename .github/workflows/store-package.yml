name: OpenGeul Store70 메타데이터 GET 읽기 비교
'on':
  workflow_dispatch:
    inputs:
      expected_pending_id:
        description: API로 생성한 고정 Store70 초안 SID1152921505702110055
        type: string
        required: true
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: opengeul-store
  cancel-in-progress: false
  queue: max
env:
  PYTHONUTF8: '1'
jobs:
  readback:
    if: github.event.repository.private == false && github.repository == 'ATLKR/OpenGeul' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/store-metadata-readback-70' && github.actor == 'ATLKR' && github.triggering_actor == 'ATLKR' && github.run_attempt == 1 && inputs.expected_pending_id == '1152921505702110055'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: 정규화 비교·비밀 없는 leaf hash 출력 검사
        run: python -m unittest discover -s tests -p test_store_metadata_readback.py -v
      - name: 고정 초안·공개 기준 GET 및 journal GET만 수행
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          EXPECTED_PENDING_ID: ${{ inputs.expected_pending_id }}
        run: python scripts/store_metadata_readback.py --output store-metadata-readback.json
      - name: 원문·URL·비밀 없는 비교 JSON 하루 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opengeul-store-metadata-readback-${{ github.run_id }}
          path: store-metadata-readback.json
          retention-days: 1
          if-no-files-found: warn
