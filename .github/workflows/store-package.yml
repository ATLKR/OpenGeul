name: OpenGeul read-only Store state
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opengeul-store-state-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' && github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/diagnostic/msix-manifest-38132094391')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Read the existing main OAuth helper at its fixed source revision
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: 8cec8aca859584a204e981217077ab7e072e41ad
        path: .store-auth-source
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Check fixed GET scope and secret-free observation output
      run: python e2e/store-state-observation.py --self-check
    - name: Read only the approved Store application and existing submission
      env:
        STORE_APP_ID: ${{ vars.STORE_APP_ID }}
        STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
        STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
        STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      run: python e2e/store-state-observation.py --output store-state-observation.json
    - name: Preserve only the sanitized observation
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: opengeul-store-state-${{ github.run_id }}
        path: store-state-observation.json
        retention-days: 1
        if-no-files-found: warn
