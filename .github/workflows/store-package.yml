name: Source75 ARM 소유 인쇄 포커스 진단
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: 실패 Source75 원본을 이용한 진단 전용 표식
        type: string
        required: true
        default: source75-owned-print-diagnostic
      verify_store_api:
        type: boolean
        default: false
      submit_to_store:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: owned-print-preview-source75-arm-diagnostic
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  E2E_ARCHITECTURE: arm64
jobs:
  print-diagnostic:
    if: >-
      github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul'
      && github.event_name == 'workflow_dispatch' && github.actor == 'ATLKR'
      && github.ref == 'refs/heads/diagnostic/owned-print-preview-75' && github.run_attempt == 1
      && inputs.release_tag == 'source75-owned-print-diagnostic'
      && inputs.verify_store_api == false && inputs.submit_to_store == false)
    runs-on: windows-11-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: f104fd4080214bc072cf39a24e73454685dd4254
          path: source-reader
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 인쇄 관측과 기존 로컬 회귀 검증
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python -m pip install -r e2e/print-requirements.txt
          python -m unittest discover -s tests -p test_print_preview_focus.py -v
          python -m unittest discover -s tests -p test_preview_actions.py -v
          python -m unittest discover -s tests -p test_print_configuration_order.py -v
          python -m unittest discover -s e2e/print_tests -v
      - name: Source75 고정 원본 ZIP과 전체 런타임을 검증
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python probe/print75_inputs.py
      - name: 기존 WebView2·Microsoft PDF·합성 인쇄 문서 준비
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          Start-Service Spooler
          Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction Stop
          ./e2e/ensure-webview2.ps1
          node e2e/table_height.mjs generate wasm-input print-fixtures
          python e2e/print_fixtures.py print-fixtures
          node e2e/verify_print_fixtures.mjs wasm-input print-fixtures
      - name: 기존 8사례를 소유한 앱·미리보기 입력으로 실행
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python -u e2e/virtual_print.py --exe runtime/OpenGeul.exe --inputs inputs/e2e-fixtures --fixtures print-fixtures --out print-evidence
      - name: 실패를 유지하며 진단 원본 크기 제한
        if: always()
        shell: pwsh
        env:
          EVIDENCE_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python ci/evidence.py pack print-evidence bounded-evidence --status $env:EVIDENCE_STATUS
          python ci/evidence.py size --limit-mib 4 diagnostic-receipt
      - name: 크기가 제한된 실제 증거 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source75-owned-print-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bounded-evidence/
            diagnostic-receipt/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
