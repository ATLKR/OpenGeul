name: Source81 ARM 시작창 읽기 전용 수명 관측
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        default: source81-readonly-wsl-timeline
      verify_store_api:
        type: boolean
        default: false
      submit_to_store:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  observe:
    if: >-
      github.event.repository.private == false && github.repository == 'ATLKR/OpenGeul'
      && github.event_name == 'workflow_dispatch' && github.actor == 'ATLKR'
      && github.ref == 'refs/heads/diagnostic/source81-wsl-timeline' && github.run_attempt == 1
      && inputs.release_tag == 'source81-readonly-wsl-timeline'
      && inputs.verify_store_api == false && inputs.submit_to_store == false
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: OS 입력 없이 실제 창 수명 읽기
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          python -m pip install Pillow PyYaml
          python probe/runner_wsl_timeline.py
      - name: 읽기 전용 원본 크기 제한
        if: always()
        shell: pwsh
        run: python ci/evidence.py size --limit-mib 8 wsl-timeline
      - name: 원본 관측 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source81-wsl-timeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: wsl-timeline/
          retention-days: 1
          if-no-files-found: error
