name: OpenGeul Store 공개 버전
'on':
  schedule:
  - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opengeul-store-public-version
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  observe:
    if: github.event.repository.private == false && (github.repository == 'ATLKR/OpenGeul' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: 공개 Store 버전을 조회하고 변경된 메타데이터만 갱신
      env:
        GH_TOKEN: ${{ github.token }}
        STORE_APP_ID: ${{ vars.STORE_APP_ID }}
        STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
        STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
        STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      run: python scripts/store_release_status.py
