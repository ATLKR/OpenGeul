name: Upstream Windows baseline
'on':
  push:
    branches: [main]
    paths: [.github/workflows/upstream-baseline.yml]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: upstream-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
    - name: Preserve upstream byte-for-byte LF files before checkout
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - name: Checkout the exact HOP source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: golbin/hop
        ref: d426f0395e97bc1972f66d894d1a7c76a36374bc
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Port only the path comparison in the upstream test
      shell: python
      run: |
        from pathlib import Path
        p = Path('tests/rhwp-boundary.test.mjs')
        s = p.read_text(encoding='utf-8')
        old = 'const relativePath = relative(studioRoot, file);'
        assert s.count(old) == 1
        s = s.replace(old, "const relativePath = relative(studioRoot, file).replaceAll('\\\\', '/');")
        p.write_text(s, encoding='utf-8', newline='\n')
    - name: Verify source pins and install frozen dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        if ((git -C third_party/rhwp rev-parse HEAD) -ne '496333b27d21ddb9114ba9ae340bcb895870c9a7') { throw 'Unexpected rhwp revision' }
        corepack enable
        pnpm install --frozen-lockfile
    - name: Run upstream contracts and frontend tests (no skipped failures)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        pnpm run test:upstream
        pnpm run test:studio
    - name: Type-check and build the unchanged editor
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        pnpm run build:studio
    - name: Record baseline (not an OpenGeul release)
      if: always()
      shell: pwsh
      run: |
        'This workflow tests upstream with a documented Windows test-path portability fix. It publishes no application or fonts.' >> $env:GITHUB_STEP_SUMMARY
    if: github.event.repository.private == false
