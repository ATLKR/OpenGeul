name: 업스트림 Windows 기준 검증
'on':
  push:
    branches: [main]
    paths: [.github/workflows/upstream-baseline.yml]
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: upstream-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
    - name: checkout 전 업스트림 LF 파일 바이트 보존
      shell: pwsh
      run: |
        git config --global core.autocrlf false
        git config --global core.longpaths true
    - name: 고정된 HOP 소스 받기
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: golbin/hop
        ref: 34bd15c97e0851627cb7f055042c5340198aeb7f
        submodules: recursive
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '24'
        package-manager-cache: false
    - name: 업스트림 시험의 경로 비교만 Windows에 맞게 수정
      shell: python
      run: |
        from pathlib import Path
        p = Path('tests/rhwp-boundary.test.mjs')
        s = p.read_text(encoding='utf-8')
        old = 'const relativePath = relative(studioRoot, file);'
        assert s.count(old) == 1
        s = s.replace(old, "const relativePath = relative(studioRoot, file).replaceAll('\\\\', '/');")
        p.write_text(s, encoding='utf-8', newline='\n')
    - name: 소스 고정 확인과 잠금된 의존성 설치
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        if ((git -C third_party/rhwp rev-parse HEAD) -ne '1a76570e833917d15817415a53c09ad61ab3203f') { throw 'Unexpected rhwp revision' }
        corepack enable
        pnpm install --frozen-lockfile
    - name: 업스트림 계약·화면 검사 실행
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        pnpm run test:upstream
        pnpm run test:studio
    - name: 유지된 편집기 타입 검사와 빌드
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        pnpm run build:studio
    - name: 업스트림 기준 검사 기록
      if: always()
      shell: pwsh
      run: |
        '문서화된 Windows 시험 경로 수정을 적용해 업스트림을 검사합니다. 앱이나 글꼴은 게시하지 않습니다.' >> $env:GITHUB_STEP_SUMMARY
    if: github.event.repository.private == false
