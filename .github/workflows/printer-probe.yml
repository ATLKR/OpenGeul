name: OpenGeul virtual-printer capability probe
on:
  push:
    branches: [work/virtual-printer-tests]
    paths: ['.github/workflows/printer-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Inspect inbox print features, drivers and spooler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner only' }
          New-Item -ItemType Directory evidence | Out-Null
          $features = @(Get-WindowsOptionalFeature -Online | Where-Object FeatureName -Match 'Print|XPS')
          $features | Select-Object FeatureName,State | ConvertTo-Json -Depth 4 | Set-Content evidence/features.json
          $features | Format-Table FeatureName,State
          $service = Get-Service Spooler
          if ($service.Status -ne 'Running') { Start-Service Spooler }
          Get-Printer | Select-Object Name,DriverName,PortName,Type | ConvertTo-Json -Depth 4 | Set-Content evidence/printers.json
          Get-Printer | Format-Table Name,DriverName,PortName
          Get-PrinterDriver | Select-Object Name,Manufacturer,DriverVersion | ConvertTo-Json -Depth 4 | Set-Content evidence/drivers.json
          Get-PrinterDriver | Format-Table Name,Manufacturer
          git archive --format=zip --output=evidence/source.zip HEAD
          Write-Host 'Capability inventory only: this job does not claim application printing passed.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: virtual-printer-capabilities-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
